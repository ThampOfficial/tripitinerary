<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script src="config.js"></script><script src="standalone.js"></script></head><body>
<title>ทริปด้วยกัน</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first app shell — sticky trip header, scrolling sheet of day/expense rows, fixed bottom tab bar; boarding-pass cards for trips */
:root{
  --paper:#F3F6F5; --card:#FFFFFF; --ink:#13302A; --muted:#5A6F68; --line:#D8E2DE; --soft:#E8EFEC;
  --accent:#0E7A6B; --accent-ink:#FFFFFF; --sun:#E9A23B; --sun-soft:#FBEBD0;
  --danger:#B9461A; --good:#167A3E; --shadow:0 1px 2px rgba(19,48,42,.06),0 6px 18px rgba(19,48,42,.06);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1715; --card:#14211E; --ink:#E4EEEA; --muted:#92A8A0; --line:#263832; --soft:#1B2B27;
  --accent:#38C1AB; --accent-ink:#06231E; --sun:#F2B55A; --sun-soft:#3A2E1A;
  --danger:#F08A5D; --good:#5BD38A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1715; --card:#14211E; --ink:#E4EEEA; --muted:#92A8A0; --line:#263832; --soft:#1B2B27;
  --accent:#38C1AB; --accent-ink:#06231E; --sun:#F2B55A; --sun-soft:#3A2E1A;
  --danger:#F08A5D; --good:#5BD38A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.25}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:56px}
.top h1{font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12.5px;color:var(--muted)}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);flex:none}
.iconbtn:hover{background:var(--soft)}
.iconbtn svg{width:19px;height:19px}

main{padding-block:16px 120px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.sm{min-height:32px;padding:0 10px;font-size:13.5px;border-radius:8px}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
a.btn{text-decoration:none;color:inherit}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px 16px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:8px}
.section-h h2{font-size:17px}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.pre{background:var(--sun-soft);color:color-mix(in srgb,var(--sun) 55%,var(--ink))}
.tag.trip{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}

/* home: boarding pass cards */
.hero{padding-block:8px 4px}
.hero h1{font-size:28px}
.pass{display:grid;grid-template-columns:1fr auto;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;width:100%;padding:0;box-shadow:var(--shadow)}
.pass:hover{border-color:var(--accent)}
.pass .main{padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:6px}
.pass .name{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.3}
.pass .route{display:flex;align-items:center;gap:8px;font-size:14px}
.pass .route .line{flex:1;max-width:80px;border-top:1.5px dashed var(--line);position:relative}
.pass .stub{border-left:2px dashed var(--line);padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:92px;position:relative;background:var(--soft)}
.pass .stub::before,.pass .stub::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.pass .stub::before{top:-9px}.pass .stub::after{bottom:-9px}
.pass .code{font-family:var(--f-mono);font-weight:600;font-size:15px;letter-spacing:.12em}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding-block:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;border-radius:10px;color:var(--muted);font-size:12px;font-weight:500}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}

/* plan */
.day{display:flex;flex-direction:column;gap:8px}
.day-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.day-n{font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--ink);color:var(--paper);border-radius:6px;padding:2px 7px;letter-spacing:.04em}
.day-h h3{font-size:16px;flex:1 1 150px;min-width:0}
.stop{display:grid;grid-template-columns:66px 1fr;gap:10px;padding:12px 14px;align-items:start}
.tin{width:100%;min-width:0;border:1px solid var(--line);background:var(--paper);font:600 14px var(--f-mono);color:var(--ink);padding:5px 6px;border-radius:8px;text-align:center}
.tin:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);border-color:var(--accent)}
.eta{display:block;font:600 12px var(--f-mono);color:var(--accent);margin-top:4px}
.stayt{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.3}
.tag.late{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.legbox{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:13.5px}
.legbox b{font-family:var(--f-mono)}
.stop + .stop{border-top:1px solid var(--line)}
.stop .time{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:2px}
.stop .nm{font-weight:600;font-size:15.5px;line-height:1.35;word-break:break-word}
.stop .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.stop .note{font-size:13.5px;color:var(--muted);margin-top:4px;white-space:pre-wrap;word-break:break-word}
.stop .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.leg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 14px 6px 76px;font-size:13px;color:var(--muted);background:var(--soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.leg .ln{width:2px;height:18px;background:repeating-linear-gradient(var(--accent) 0 4px,transparent 4px 7px);flex:none}
.leg b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.leg .sp{flex:1}
@media (max-width:440px){.leg{padding-left:14px}}
.rwrap{display:flex;flex-direction:column;gap:4px}
.gmap{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.gmap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.rmap{width:100%;height:auto;display:block;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.rmap .grid{stroke:var(--line);stroke-width:1}
.rmap .seg{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.rmap .seg.est{stroke-dasharray:2 7}
.rmap .pin{fill:var(--sun);stroke:var(--card);stroke-width:2.5}
.rmap .pin.first{fill:var(--ink)}
.rmap .pin.hl{fill:var(--danger)}
.rmap .no{fill:#13302A;font:600 13px var(--f-mono)}
.rmap .no.inv{fill:var(--paper)}
.rmap .pin.hl+.no{fill:#fff}
.rmap .lbl{fill:var(--ink);font:500 15px var(--f-body);paint-order:stroke;stroke:var(--soft);stroke-width:4px;stroke-linejoin:round}
.rmap .km{fill:var(--accent);font:600 13px var(--f-mono);paint-order:stroke;stroke:var(--soft);stroke-width:4px;stroke-linejoin:round}
.rmap .sbar{stroke:var(--muted);stroke-width:3}
.pinno{flex:none;display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--sun);color:#13302A;font:600 11.5px var(--f-mono);margin-right:8px;vertical-align:2px}
.pinno.none{background:var(--soft);color:var(--muted);border:1px dashed var(--line)}
.desc{font-size:14.5px;margin-top:6px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.gal{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
.gitem{flex:none;width:136px;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px}
.gimg{display:block;width:136px;height:100px;border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.gimg img{width:100%;height:100%;object-fit:cover;display:block}
.gcap{font-size:12.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.pcell{display:flex;flex-direction:column;gap:6px;min-width:0}
.pimg{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pdel{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;font-size:16px;line-height:1;padding:0}
.pcap{min-height:34px;padding:4px 8px;font-size:14px}
.padd{aspect-ratio:4/3;max-width:100%;border:1.5px dashed var(--line);border-radius:10px;align-items:center;justify-content:center;color:var(--muted);font-size:13px;cursor:pointer}
.padd svg{width:22px;height:22px}
.lcap{color:#fff;max-width:640px;text-align:center;font-size:14.5px;line-height:1.5}
.daytot{font-size:13px;color:var(--muted);white-space:nowrap}
.daytot b{font-family:var(--f-mono);color:var(--ink);font-weight:600}

/* money */
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tot{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);min-width:0}
.tot .v{font-family:var(--f-mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot.big{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tot.big .muted{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.exp{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border:0;background:none;width:100%;text-align:left}
.exp + .exp{border-top:1px solid var(--line)}
.exp:hover{background:var(--soft)}
.exp .t{font-weight:600;min-width:0;word-break:break-word}
.exp .a{font-family:var(--f-mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.exp .m{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.dategroup{font-size:12.5px;color:var(--muted);padding:10px 14px 4px;font-weight:600;background:var(--soft);border-top:1px solid var(--line)}
.dategroup:first-child{border-top:0;border-radius:14px 14px 0 0}

/* summary */
.bar{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
td.num,th.num{font-family:var(--f-mono)}
.settle{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;align-items:center}
.settle + .settle{border-top:1px solid var(--line)}
.settle .who{font-weight:600}
.settle .res{font-family:var(--f-mono);font-weight:600;font-size:17px;text-align:right}
.settle .calc{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.pay{color:var(--danger)} .get{color:var(--good)}
.xfer{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap}
.xfer + .xfer{border-top:1px solid var(--line)}
.xfer .arrow{color:var(--muted)}

/* files */
.files{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center;padding:0;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ft{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:4px;word-break:break-all;line-height:1.2}
.thumb .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:14px;line-height:1}
.addfile{border-style:dashed;color:var(--muted);font-size:12px;flex-direction:column;gap:2px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.addfile svg{width:20px;height:20px}

/* forms / sheet */
.scrim{position:fixed;inset:0;background:rgba(8,20,17,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.sheet h2{font-size:19px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:42px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:16px}
textarea.inp{min-height:70px;resize:vertical}
.inp:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;min-height:36px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.checks{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:4px}
.check{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:6px 8px;border-radius:8px}
.check input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.check .inp{width:110px;min-height:34px;padding:4px 8px;font-size:15px;text-align:right}
.hint{font-size:12.5px;color:var(--muted)}
.ok{color:var(--good)} .err{color:var(--danger)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--card);padding-block:10px 4px;margin-bottom:-4px}
.actions .grow{flex:1}

.list-edit{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 14px}
.li + .li{border-top:1px solid var(--line)}
.li .grow{flex:1;min-width:0;word-break:break-word}

.empty{text-align:center;padding:28px 18px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty svg{width:40px;height:40px;opacity:.6}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:17px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.light{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.light img{max-width:100%;max-height:calc(100% - 60px);object-fit:contain;border-radius:6px}
.light .bar2{display:flex;gap:8px}
.light .btn{background:#fff;color:#111;border-color:#fff}
.code-big{font-family:var(--f-mono);font-size:28px;font-weight:600;letter-spacing:.2em;background:var(--soft);border:1.5px dashed var(--line);border-radius:12px;padding:10px 16px;text-align:center;user-select:all}
.banner{padding:10px 14px;border-radius:12px;background:var(--sun-soft);font-size:14px}
.avs{display:flex}

const EN_FULL={'วัน':'Day','วันที่':'Day','เวลา':'Time'};
function tr(s){if(LANG!=='en'||s==null)return s;s=String(s);if(!THAI_RE.test(s))return s;const ft=EN_FULL[s.trim()];if(ft)return s.replace(s.trim(),ft);const o=s.replace(EN_RE,m=>EN_DICT[m]);return THAI_RE.test(o)?s:o.replace(/ {2,}/g,' ').replace(/ ([,.:)])/g,'$1')}
function trNode(root){if(LANG!=='en')return;
  const skip=n=>{for(let e=n.parentElement;e;e=e.parentElement){if(/^(SCRIPT|STYLE|TEXTAREA)$/.test(e.tagName))return true}return false};
  if(root.nodeType===3){if(THAI_RE.test(root.nodeValue)&&!skip(root)){const v=tr(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v}return}
  if(root.nodeType!==1)return;
  const els=[root,...root.querySelectorAll('[placeholder],[title],[aria-label]')];
  els.forEach(el=>['placeholder','title','aria-label'].forEach(a=>{const v=el.getAttribute&&el.getAttribute(a);if(v&&THAI_RE.test(v)){const t=tr(v);if(t!==v)el.setAttribute(a,t)}}));
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const list=[];while((n=w.nextNode()))if(THAI_RE.test(n.nodeValue))list.push(n);
  list.forEach(n=>{if(skip(n))return;const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v})}
if(LANG==='en'){document.documentElement.lang='en';
  new MutationObserver(ms=>ms.forEach(m=>{if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(trNode)})).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
  document.addEventListener('DOMContentLoaded',()=>trNode(document.body))}
function setLang(l){try{localStorage.setItem('tripLang',l)}catch(e){}location.reload()}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-lang]');if(b)setLang(b.dataset.lang)});
const langBtn=()=>LANG==='en'?'<button class="btn sm" data-lang="th" title="ภาษาไทย">ไทย</button>':'<button class="btn sm" data-lang="en" title="English">EN</button>';

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);

const CURS={THB:['฿','บาท'],JPY:['¥','เยน'],KRW:['₩','วอน'],CNY:['¥','หยวน'],TWD:['NT$','ดอลลาร์ไต้หวัน'],HKD:['HK$','ดอลลาร์ฮ่องกง'],SGD:['S$','ดอลลาร์สิงคโปร์'],MYR:['RM','ริงกิต'],VND:['₫','ด่ง'],LAK:['₭','กีบ'],KHR:['៛','เรียล'],IDR:['Rp','รูเปียห์'],PHP:['₱','เปโซ'],INR:['₹','รูปี'],USD:['$','ดอลลาร์สหรัฐ'],EUR:['€','ยูโร'],GBP:['£','ปอนด์'],CHF:['CHF','ฟรังก์สวิส'],AUD:['A$','ดอลลาร์ออสเตรเลีย'],NZD:['NZ$','ดอลลาร์นิวซีแลนด์'],CAD:['C$','ดอลลาร์แคนาดา'],AED:['AED','ดีแรห์ม']};

const toBase=(a,c)=>(+a||0)*rateOf(c);
const money=(n,c)=>fmt(n)+' '+curSym(c||baseCur());
const baht=n=>money(n,baseCur());
const missingRates=()=>[...new Set([...S.expenses,...S.deposits].map(x=>x.cur||'THB').filter(c=>c!==baseCur()&&!rateOf(c)))];
const lastCur=()=>{const c=ls.get('cur:'+S.tripId);return tripCurs().includes(c)?c:baseCur()};

function curBreakdown(){const m={};S.expenses.forEach(e=>{const c=e.cur||'THB';m[c]=(m[c]||0)+(+e.amount||0)});const ks=Object.keys(m);
  return (ks.some(c=>c!==baseCur())?`<div class="small muted">แยกตามสกุลเงิน: ${ks.map(c=>`<b class="num">${money(m[c],c)}</b>`).join(' · ')}${ks.filter(c=>c!==baseCur()&&rateOf(c)).map(c=>` <span class="tag num">1 ${c} = ${rateOf(c)} ${baseCur()}</span>`).join('')}</div>`:'')+missBanner()}
const PALETTE=['#0E7A6B','#E9A23B','#5B6BD8','#D2557A','#3E9BD6','#8B6FD1','#C9762C','#4A9A4F','#B35C9E','#6E8A3A','#2F7FA0','#A0524A'];

/* ---------- sheet / confirm / lightbox ---------- */
function closeSheet(){$('#layer').innerHTML='';document.removeEventListener('keydown',escClose)}

function openSheet(title,body,mount){
  $('#layer').innerHTML=`<div class="scrim" id="scrim"><form class="sheet" id="sheet" novalidate><h2>${esc(title)}</h2>${body}</form></div>`;
  const sc=$('#scrim');sc.addEventListener('click',e=>{if(e.target===sc)closeSheet()});

function confirmBox(msg,okLabel,onOk){

/* ---------- files ---------- */
function guessType(n){n=(n||'').toLowerCase();if(/\.pdf$/.test(n))return'application/pdf';if(/\.jpe?g$/.test(n))return'image/jpeg';if(/\.png$/.test(n))return'image/png';if(/\.webp$/.test(n))return'image/webp';if(/\.gif$/.test(n))return'image/gif';return''}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{res(im);setTimeout(()=>URL.revokeObjectURL(u),1000)};im.onerror=rej;im.src=u})}
async function compress(file){const im=await loadImg(file);let max=1400,q=.78,out='';
  for(let i=0;i<8;i++){const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<225000)return out;max*=.8;q=Math.max(.5,q-.06)}
  return out}
async function uploadFile(file){
  const type=file.type&&file.type!=='image/jpg'?file.type:(guessType(file.name)||file.type);
  if(S.assets){try{const r=await S.assets.upload(file,{type});return{k:'a',id:r.id,name:file.name,type:r.contentType}}
    catch(e){if(['not_granted','capability_disabled','capability_removed'].includes(e&&e.code))S.assets=null;else throw e}}
  if((type||'').startsWith('image/')){const d=await compress(file);const id=gid();
    await S.db.doc(`trips/${S.tripId}/blobs/${id}`).set({d,name:file.name});return{k:'d',id,name:file.name,type:'image/jpeg'}}
  throw{code:'no_assets'};}
const SA=!!window.TRIP_STANDALONE;
const blobUrl=id=>window.TRIP_BLOB_URL?window.TRIP_BLOB_URL(id):'/_blob/'+id;
const fileUrl=id=>window.TRIP_FILE_URL?window.TRIP_FILE_URL(id):'/_blob/'+id;
function fileSrc(f){return f.k==='a'?blobUrl(f.id):(S.blobCache[f.id]||'')}
async function hydrateBlobs(root){
  for(const im of root.querySelectorAll('img[data-blob]')){const id=im.dataset.blob;if(S.blobCache[id]){im.src=S.blobCache[id];continue}
    try{const s=await S.db.doc(`trips/${S.tripId}/blobs/${id}`).get();if(s.exists){S.blobCache[id]=s.data().d;im.src=S.blobCache[id]}}catch(e){}}}
function thumbHTML(f,i,removable){
  const img=(f.type||'').startsWith('image/');const ext=(f.name||'').split('.').pop().slice(0,4).toUpperCase()||'FILE';
  const inner=img?(f.k==='a'?`<img loading="lazy" alt="${esc(f.name)}" src="${esc(blobUrl(f.id))}">`:`<img alt="${esc(f.name)}" data-blob="${esc(f.id)}">`)
    :`<span class="ft">${esc(ext)}<br>${esc((f.name||'').slice(0,18))}</span>`;
  const open=img?`<button type="button" class="thumb" data-open="${i}" title="${esc(f.name)}">${inner}</button>`
    :`<a class="thumb" href="${esc(fileUrl(f.id))}" target="_blank" rel="noopener" title="${esc(f.name)}">${inner}</a>`;
  return removable?`<span style="position:relative;display:inline-block">${open}<button type="button" class="x" data-rm="${i}" aria-label="ลบไฟล์" style="position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff">×</button></span>`:open;}
function filesView(files){if(!files||!files.length)return'';return `<div class="files" data-files>${files.map((f,i)=>thumbHTML(f,i,false)).join('')}</div>`}
function wireFiles(root,files){root.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.stopPropagation();const f=files[+b.dataset.open];lightbox(fileSrc(f),f.name)});hydrateBlobs(root)}
/* editable attachments inside a form */
function attachWidget(host,files){

    <input type="file" id="fileIn" multiple accept="image/*,application/pdf" hidden>
    <div class="hint" id="upMsg">${S.assets?'รูปภาพหรือ PDF ไม่เกิน 20 MB ต่อไฟล์':'แนบได้เฉพาะรูปภาพ (ระบบจะย่อขนาดให้อัตโนมัติ)'}</div>`;
    host.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.rm,1);draw()});
    host.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const f=files[+b.dataset.open];lightbox(fileSrc(f),f.name)});
    hydrateBlobs(host);
    host.querySelector('#fileIn').onchange=async e=>{const list=[...e.target.files];const msg=host.querySelector('#upMsg');
      for(const [n,file] of list.entries()){msg.textContent=`กำลังอัปโหลด ${n+1}/${list.length}: ${file.name}`;msg.className='hint';
        try{files.push(await uploadFile(file))}catch(err){console.error(err);
          toast(err.code==='too_large'?'ไฟล์ใหญ่เกิน 20 MB':err.code==='no_assets'?'บัญชีนี้แนบได้เฉพาะรูปภาพ':err.code==='unsupported_type'?'ไฟล์ชนิดนี้แนบไม่ได้ ใช้รูปภาพหรือ PDF':'อัปโหลดไม่สำเร็จ',3600)}}
      draw();};};
  draw();}

/* ---------- maps ---------- */
function parseLoc(s){s=(s||'').trim();if(!s)return{};
  const m=s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|ll|destination|daddr)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i)||s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/^\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/);
  if(m){const lat=+m[1],lng=+m[2];if(Math.abs(lat)<=90&&Math.abs(lng)<=180)return{lat,lng}}return{};}
const ptQ=p=>p.lat!=null&&p.lat!==''?`${p.lat},${p.lng}`:[p.name,p.address].filter(Boolean).join(' ');
function openUrl(p){if(p.url&&/^https?:\/\//.test(p.url))return p.url;return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(ptQ(p))}
function navUrl(p){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(ptQ(p))}
function routeUrl(list){if(list.length<2)return navUrl(list[0]);const o=list[0],d=list[list.length-1],w=list.slice(1,-1).slice(0,9);
  return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(ptQ(o))+'&destination='+encodeURIComponent(ptQ(d))+(w.length?'&waypoints='+encodeURIComponent(w.map(ptQ).join('|')):'')}

/* ---------- legs: distance & time between stops ---------- */
const hasLoc=p=>p&&p.lat!=null&&p.lat!==''&&p.lng!=null&&p.lng!=='';
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const isSet=v=>v!=null&&v!=='';
const pairKey=(a,b)=>ptQ(a)+'>'+ptQ(b);
function legOf(prev,p){if(p.legFrom===prev.id&&(isSet(p.legKm)||isSet(p.legMin)))return{km:p.legKm,min:p.legMin,manual:true};
  const A=S.autoLegs&&S.autoLegs[pairKey(prev,p)];if(A&&A.ok)return{km:A.m/1000,min:Math.round(A.s/60),manual:false,auto:true};
  if(hasLoc(prev)&&hasLoc(p)){const d=hav(prev,p)*1.3;return{km:d,min:Math.round(d/45*60+5),manual:false}}return null}
const kmTxt=k=>(+k).toLocaleString(LOC,{maximumFractionDigits:+k<10?1:0})+' กม.';
const minTxt=m=>{m=Math.round(+m);if(m<60)return m+' นาที';const h=Math.floor(m/60),r=m%60;return h+' ชม.'+(r?' '+r+' นาที':'')};
const legUrl=(a,b)=>'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(ptQ(a))+'&destination='+encodeURIComponent(ptQ(b));
function legRow(prev,p){const L=legOf(prev,p);
  const txt=L?`<span>${L.manual||L.auto?'':'≈ '}${isSet(L.km)?'<b>'+kmTxt(L.km)+'</b>':''}${isSet(L.km)&&isSet(L.min)?' · ':''}${isSet(L.min)?'<b>'+minTxt(L.min)+'</b>':''}${L.manual?'':L.auto?' (Google Maps)':' (ประมาณจากพิกัด)'}</span>`:'<span>ยังไม่ได้ใส่ระยะทาง</span>';
  return `<div class="leg" data-leg="${esc(p.id)}" data-prev="${esc(prev.id)}"><span class="ln"></span>${txt}<span class="sp"></span><a class="btn sm" href="${esc(legUrl(prev,p))}" target="_blank" rel="noopener">ดูใน Google Maps</a><button class="btn sm" data-legedit>${L&&L.manual?'แก้ไข':'ใส่ระยะทาง'}</button></div>`}
function legSheet(prev,p){const own=p.legFrom===prev.id;const m=own&&isSet(p.legMin)?Math.round(+p.legMin):null;
  openSheet('ระยะทางและเวลาเดินทาง',`<p style="margin:0"><strong>${esc(prev.name)}</strong> → <strong>${esc(p.name)}</strong></p>
   <a class="btn" href="${esc(legUrl(prev,p))}" target="_blank" rel="noopener">${I.route}ดูระยะทางและเวลาใน Google Maps</a>
   <span class="hint" style="margin-top:-8px">ดูตัวเลขจาก Google Maps แล้วพิมพ์ลงช่องด้านล่าง</span>
   <div class="grid2"><div class="field"><label for="lk">ระยะทาง (กม.)</label><input class="inp num" id="lk" inputmode="decimal" value="${own&&isSet(p.legKm)?esc(p.legKm):''}" placeholder="0"></div>
   <div class="field"><span class="lbl">เวลาเดินทาง</span><div class="row" style="flex-wrap:nowrap"><input class="inp num" id="lh" aria-label="ชั่วโมง" inputmode="numeric" value="${m!=null&&m>=60?Math.floor(m/60):''}" placeholder="ชม."><input class="inp num" id="lm" aria-label="นาที" inputmode="numeric" value="${m!=null?m%60:''}" placeholder="นาที"></div></div></div>
   <div class="actions">${own?'<button type="button" class="btn danger" id="clr">ล้างค่า</button>':''}<span class="grow"></span><button type="button" class="btn" id="cx">ยกเลิก</button><button class="btn pri" id="ok">บันทึก</button></div>`,f=>{
    const q=s=>f.querySelector(s);q('#lk').focus();q('#cx').onclick=closeSheet;
    const ref=S.db.doc(`trips/${S.tripId}/places/${p.id}`);
    if(own)q('#clr').onclick=async()=>{try{await ref.update({legFrom:'',legKm:null,legMin:null});closeSheet()}catch(e){writeErr(e)}};
    q('#ok').onclick=async()=>{const k=parseFloat(q('#lk').value.replace(/,/g,'')),h=parseInt(q('#lh').value)||0,mm=parseInt(q('#lm').value)||0;
      const km=isNaN(k)?null:k,min=(q('#lh').value.trim()||q('#lm').value.trim())?h*60+mm:null;
      if(km==null&&min==null){q('#lk').focus();return}
      q('#ok').disabled=true;try{await ref.update({legFrom:prev.id,legKm:km,legMin:min});closeSheet();toast('บันทึกแล้ว')}catch(e){q('#ok').disabled=false;writeErr(e)}}})}

/* ---------- money math ---------- */
function portions(e){const ids=people().map(p=>p.id);let among=(e.among||[]).filter(id=>ids.includes(id));if(!among.length)among=ids;
  const a=+e.amount||0,r=rateOf(e.cur),out={};if(!among.length)return out;
  if(e.split==='custom'&&e.custom){among.forEach(id=>out[id]=(+e.custom[id]||0)*r)}else among.forEach(id=>out[id]=a*r/among.length);return out}
function calc(){
  const ps=people(),share={},paid={},dep={};ps.forEach(p=>{share[p.id]=0;paid[p.id]=0;dep[p.id]=0});
  let total=0,fundSpent=0,pre=0,trip=0;const byCat={};
  for(const e of S.expenses){const a=toBase(e.amount,e.cur);total+=a;e.type==='pre'?pre+=a:trip+=a;byCat[e.cat]=(byCat[e.cat]||0)+a;
    if(e.paidBy==='fund')fundSpent+=a;else if(paid[e.paidBy]!=null)paid[e.paidBy]+=a;
    const pr=portions(e);for(const k in pr)if(share[k]!=null)share[k]+=pr[k];}
  let depTotal=0;for(const d of S.deposits){const a=toBase(d.amount,d.cur);depTotal+=a;if(dep[d.personId]!=null)dep[d.personId]+=a}
  const fundBal=depTotal-fundSpent;
  const rows=ps.map(p=>{const owe=share[p.id]-dep[p.id]-paid[p.id];return{p,share:share[p.id],dep:dep[p.id],paid:paid[p.id],owe}});
  // transfers: positive owe pays; negative receives. fund holds fundBal cash.
  const parties=rows.map(r=>({id:r.p.id,v:-r.owe}));
  const holder=S.trip.fundHolder&&person(S.trip.fundHolder)?S.trip.fundHolder:null;
  if(Math.abs(fundBal)>.004){if(holder){parties.find(x=>x.id===holder).v-=fundBal}else parties.push({id:'fund',v:-fundBal})}
  const deb=parties.filter(x=>x.v<-.5).map(x=>({...x,v:-x.v})).sort((a,b)=>b.v-a.v),cre=parties.filter(x=>x.v>.5).sort((a,b)=>b.v-a.v),xf=[];
  let i=0,j=0;while(i<deb.length&&j<cre.length){const m=Math.min(deb[i].v,cre[j].v);xf.push({from:deb[i].id,to:cre[j].id,amt:m});deb[i].v-=m;cre[j].v-=m;if(deb[i].v<.5)i++;if(cre[j].v<.5)j++}
  return{total,pre,trip,byCat,rows,depTotal,fundSpent,fundBal,xf,holder};}

/* ---------- boot ---------- */
(async function boot(){
  if(!window.claude||typeof window.claude.use!=='function'){renderNoRuntime();return}
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  S.db=db;S.user=user;
  if(!db||!user){renderNoRuntime();return}
  S.uid=await user.id();S.me=await user.me();
  if(!S.uid){renderNoRuntime('ลงชื่อเข้าใช้ Claude ก่อน แล้วเปิดลิงก์นี้อีกครั้งเพื่อดูทริปของคุณ');return}
  const cw=await user.can('data.write');S.canWrite=cw!==false;
  claude.use('assets').then(a=>{S.assets=a}).catch(()=>{});
  const t=setTimeout(()=>{if(!S.tripsLoaded){S.offline=true;render()}},10000);
  db.collection('trips').where('members','array-contains',S.uid).onSnapshot(snap=>{
    S.trips=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.start||'').localeCompare(a.start||''));
    if(!snap.metadata.fromCache){S.tripsLoaded=true;S.offline=false;clearTimeout(t)}
    if(!S.tripId)render();
  },e=>{clearTimeout(t);S.tripsErr=e;S.tripsLoaded=true;render()});
  window.addEventListener('hashchange',route);route();
})();

function route(){
  const h=(location.hash||'').slice(1);
  if(h.startsWith('t-')){const id=h.slice(2);if(id!==S.tripId)openTrip(id);return}
  if(S.tripId)closeTrip();
  render();
  if(h.startsWith('join-'))setTimeout(()=>joinSheet(h.slice(5)),50);
}
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h}
function closeTrip(){S.subs.forEach(u=>u());S.subs=[];S.tripId=null;S.trip=null;S.places=[];S.expenses=[];S.deposits=[];S.docs=[]}
function openTrip(id){
  closeTrip();S.tripId=id;S.tripLoaded=false;render();
  const db=S.db;
  S.subs.push(db.doc('trips/'+id).onSnapshot(s=>{
    if(!s.exists){if(!s.metadata.fromCache){toast('ไม่พบทริปนี้');go('')}return}
    const d=s.data();if(!(d.members||[]).includes(S.uid)&&!s.metadata.fromCache){toast('คุณไม่ได้อยู่ในทริปนี้แล้ว');go('');return}
    S.trip={id,...d};S.tripLoaded=true;render()},e=>{toast('โหลดทริปไม่สำเร็จ');go('')}));
  for(const c of ['places','expenses','deposits','docs'])
    S.subs.push(db.collection(`trips/${id}/${c}`).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));if(S.trip)render()},()=>{}));
}

        const ok=f.querySelector('#ok');ok.textContent='เข้าร่วมทริป';ok.onclick=async()=>{
          const who=(f.querySelector('input[name=who]:checked')||{}).value;ok.disabled=true;

/* ---------- ordering: by time unless the day was reordered by hand ---------- */
const dkey=d=>d||'none';
const isManual=d=>!!(S.trip&&S.trip.manualDays&&S.trip.manualDays[dkey(d)]);
const byOrder=(a,b)=>((a.order??0)-(b.order??0))||(a.time||'99').localeCompare(b.time||'99');
const byTime=(a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')||((a.order??0)-(b.order??0));
const sortFor=d=>isManual(d)?byOrder:byTime;
function orderFor(day,time,ex){const arr=S.places.filter(x=>(x.day||'')===(day||'')&&x.id!==ex).sort(byOrder);
  if(!arr.length)return 0;const last=(arr[arr.length-1].order??0)+10;
  if(!time||!isManual(day))return last;
  let k=-1;arr.forEach((x,i)=>{if(x.time&&x.time<=time)k=i});
  if(k===arr.length-1)return last;if(k<0)return (arr[0].order??0)-10;
  return ((arr[k].order??0)+(arr[k+1].order??0))/2}
function setManual(d,on){const m={...((S.trip&&S.trip.manualDays)||{})};m[dkey(d)]=on;return saveTrip({manualDays:m})}

/* ---------- route sketch: stops drawn from their coordinates (no map tiles) ---------- */
function routeMapSVG(arr,hl){
  const pts=arr.map((p,i)=>({p,i})).filter(o=>hasLoc(o.p));if(!pts.length)return'';
  const W=520,H=320,P=46;
  const lat0=pts.reduce((s,o)=>s+(+o.p.lat),0)/pts.length,kx=Math.cos(lat0*Math.PI/180);
  const raw=pts.map(o=>[(+o.p.lng)*kx,-(+o.p.lat)]);
  const xs=raw.map(r=>r[0]),ys=raw.map(r=>r[1]);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const sc=Math.min((W-2*P)/Math.max(maxx-minx,1e-9),(H-2*P)/Math.max(maxy-miny,1e-9),(W-2*P)/0.02);
  const cx=(minx+maxx)/2,cy=(miny+maxy)/2,X=x=>W/2+(x-cx)*sc,Y=y=>H/2+(y-cy)*sc;
  const xy=raw.map(r=>[X(r[0]),Y(r[1])]);
  let g='';for(let x=40;x<W;x+=60)g+=`<line class="grid" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`;for(let y=30;y<H;y+=60)g+=`<line class="grid" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;
  let seg='',kml='';
  for(let j=1;j<pts.length;j++){const a=pts[j-1],b=pts[j],[x1,y1]=xy[j-1],[x2,y2]=xy[j];
    const L=b.i===a.i+1?legOf(a.p,b.p):null,km=L&&isSet(L.km)?+L.km:hav(a.p,b.p)*1.3,man=!!(L&&(L.manual||L.auto));
    seg+=`<line class="seg${man?'':' est'}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
    if(Math.hypot(x2-x1,y2-y1)>70)kml+=`<text class="km" x="${((x1+x2)/2).toFixed(1)}" y="${((y1+y2)/2-6).toFixed(1)}" text-anchor="middle">${man?'':'≈'}${esc(kmTxt(km))}</text>`}
  const pins=pts.map((o,j)=>{const [x,y]=xy[j],right=x<W-140,nm=o.p.name.length>14?o.p.name.slice(0,13)+'…':o.p.name,isH=hl&&o.p.id===hl;
    return `<circle class="pin${j===0?' first':''}${isH?' hl':''}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isH?16:14}"/><text class="no${j===0||isH?' inv':''}" x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle">${o.i+1}</text>
      <text class="lbl" x="${(x+(right?18:-18)).toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${right?'start':'end'}">${esc(nm)}</text>`}).join('');
  const kmPx=111.32/sc,nice=[.1,.2,.5,1,2,5,10,20,50,100,200,500,1000].find(k=>k/kmPx>=60)||1000,bl=nice/kmPx;
  const scale=`<line class="sbar" x1="16" y1="${H-16}" x2="${(16+bl).toFixed(1)}" y2="${H-16}"/><text class="km" x="16" y="${H-22}">${nice<1?nice*1000+' ม.':nice+' กม.'}</text><text class="km" x="${W-16}" y="22" text-anchor="end">N ↑</text>`;
  return `<svg class="rmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="ผังเส้นทาง ${pts.length} จุด">${g}${seg}${kml}${pins}${scale}</svg>`}
function gmapEmbed(arr){const q=arr.map(ptQ).filter(Boolean).slice(0,12);if(!q.length)return'';
  return q.length===1?'https://maps.google.com/maps?q='+encodeURIComponent(q[0])+'&z=14&output=embed':'https://maps.google.com/maps?saddr='+encodeURIComponent(q[0])+'&daddr='+q.slice(1).map(encodeURIComponent).join('+to:')+'&output=embed'}
function rmapBlock(arr,hl){if(SA){const u=gmapEmbed(arr);if(!u)return'';return `<div class="rwrap"><div class="gmap"><iframe loading="lazy" src="${esc(u)}" title="แผนที่ Google"></iframe></div>${routeMapSVG(arr,hl)?'':''}</div>`}
  const svg=routeMapSVG(arr,hl);if(!svg)return'';const miss=arr.filter(p=>!hasLoc(p)).length;
  return `<div class="rwrap">${svg}<div class="hint">ผังจากพิกัดของแต่ละจุด เส้นประคือระยะประมาณ${miss?` · ${miss} จุดยังไม่มีพิกัด จึงไม่อยู่ในผัง`:''}</div></div>`}

/* ---------- day timeline: arrival = previous departure + travel ---------- */
const normTime=v=>{v=String(v||'').trim().replace(/[.\s]/g,':');if(!v)return '';let m=v.match(/^(\d{1,2}):(\d{1,2})$/)||v.match(/^(\d{1,2})(\d{2})$/)||v.match(/^(\d{1,2})$/);if(!m)return null;const h=+m[1],mi=+(m[2]||0);if(h>23||mi>59)return null;return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')};
const tMin=t=>{if(!t)return null;const [h,m]=String(t).split(':').map(Number);return isNaN(h)?null:h*60+(m||0)};
const tHm=x=>{x=((Math.round(x)%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};
function timeline(arr){const out={};let dep=null;
  arr.forEach((p,i)=>{const L=i>0?legOf(arr[i-1],p):null;let eta=null;
    if(dep!=null&&L&&isSet(L.min))eta=dep+(+L.min);
    const fixed=tMin(p.time),at=fixed!=null?fixed:eta;
    out[p.id]={eta,late:fixed!=null&&eta!=null&&eta>fixed+5?Math.round(eta-fixed):0,arrive:at,depart:at!=null?at+(+p.stay||0):null};
    dep=out[p.id].depart});
  return out}

S.autoLegs={};S.legPending={};
function fetchLegs(arr){if(!window.TRIP_ROUTE||!arr||arr.length<2)return;
  const need=[];for(let i=1;i<arr.length;i++){const k=pairKey(arr[i-1],arr[i]);if(!S.autoLegs[k]&&!S.legPending[k]&&ptQ(arr[i-1])&&ptQ(arr[i]))need.push([arr[i-1],arr[i],k])}
  if(!need.length)return;need.forEach(n=>S.legPending[n[2]]=1);
  window.TRIP_ROUTE(need.map(n=>[ptQ(n[0]),ptQ(n[1])]),'driving').then(legs=>{need.forEach((n,i)=>{S.autoLegs[n[2]]=legs[i]||{ok:false}})})
    .catch(()=>{}).finally(()=>{need.forEach(n=>delete S.legPending[n[2]]);if(S.tab==='plan'&&!document.querySelector('#sheet'))render()})}
async function movePlace(p,dir,arr){
  const i=arr.findIndex(x=>x.id===p.id),j=i+dir;if(j<0||j>=arr.length)return;
  const re=arr.slice();[re[i],re[j]]=[re[j],re[i]];
  try{if(!isManual(p.day))await setManual(p.day,true);for(const [k,x] of re.entries()){if((x.order??-1)!==k*10)await S.db.doc(`trips/${S.tripId}/places/${x.id}`).update({order:k*10})}}catch(e){writeErr(e)}}
function placeSheet(p){
  const cats=placeCats(),days=tripDays(S.trip),files=[...((p&&p.files)||[])],photos=((p&&p.photos)||[]).map(x=>({...x}));
  openSheet(p?'แก้ไขสถานที่':'เพิ่มสถานที่',`
   <div class="field"><label for="pn">ชื่อสถานที่</label><input class="inp" id="pn" value="${esc(p?.name||'')}" placeholder="เช่น ดอยอินทนนท์"></div>

const I_ai='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"/><path d="M18.5 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>';
const AI_TYPES={attraction:['ที่เที่ยว',/เที่ยว/],food:['ร้านอาหาร',/อาหาร/],cafe:['คาเฟ่',/คาเฟ่/],hotel:['ที่พัก',/พัก/]};
const aiCat=t=>{const pc=placeCats(),re=(AI_TYPES[t]||AI_TYPES.attraction)[1];return ((pc.find(c=>re.test(c.name))||pc[0])||{}).id||''};
function aiPrompt(o){
  const dayLines=o.dates.map((d,i)=>`Day ${i+1}: ${d} (${dlabel(d,{weekday:'long'})})`).join('\n');
  const inc=['popular tourist attractions'];if(o.food)inc.push('a well-known local restaurant for lunch and one for dinner each day');if(o.cafe)inc.push('one popular cafe per day');if(o.hotel)inc.push('a well-reviewed hotel or stay area as the LAST stop of each day');
  const pace={chill:'relaxed: 3-4 attractions per day, long stays',normal:'normal: 4-5 attractions per day',packed:'packed: 6-7 attractions per day, short stays'}[o.pace];
  return `You are an experienced local travel planner. Plan a ${o.dates.length}-day itinerary for a group trip to: ${o.dest}
${dayLines}
Start each day around ${o.start}. Pace: ${pace}.
Include: ${inc.join('; ')}.
Pick places that really exist and that most visitors love (well-known, highly rated). Group nearby places on the same day and order each day's stops to keep travel short. Leave realistic travel time between stops when setting times.
${o.wish?'Traveller wishes: '+o.wish+'\n':''}${o.existing.length?'Already in their plan, do not repeat: '+o.existing.join(', ')+'\n':''}
Reply with ONLY JSON in exactly this shape:
{"days":[{"day":1,"stops":[{"name":"Place name","type":"attraction","time":"09:00","desc":"1-2 short sentences in ${LANG==='en'?'English':'Thai'}: why go, what to see or order, a practical tip","area":"district or neighbourhood","lat":18.8048,"lng":98.9216}]}]}
Rules: "type" is one of attraction, food, cafe, hotel. "time" is the arrival time HH:MM (24h). Use the name locals and maps use (for Thailand write the Thai name; elsewhere the local or English name). "desc" must be in ${LANG==='en'?'English':'Thai'}. lat/lng approximate to 4 decimals, or null if unsure. Exactly ${o.dates.length} day objects.`}

/* ---------- PDF itinerary (drawn on canvas, packed into a JPEG-page PDF) ---------- */
const PW=1240,PH=1754,PM=96,CW=PW-2*PM;
const FB='"IBM Plex Sans Thai",system-ui,sans-serif',FD='"Bai Jamjuree","IBM Plex Sans Thai",sans-serif',FM='"IBM Plex Mono",ui-monospace,monospace';
const PC={ink:'#13302A',muted:'#5A6F68',line:'#D8E2DE',soft:'#EEF3F1',accent:'#0E7A6B',sun:'#E9A23B',faint:'#8A9A95'};
const segTh=(typeof Intl!=='undefined'&&Intl.Segmenter)?new Intl.Segmenter('th',{granularity:'word'}):null;
function wrapText(ctx,text,maxW){const out=[];
  for(const para of String(text??'').split('\n')){const parts=segTh?[...segTh.segment(para)].map(s=>s.segment):para.split(/(\s+)/);let line='';
    for(const w of parts){const t=line+w;
      if(ctx.measureText(t).width>maxW&&line.trim()){out.push(line.trimEnd());line=w.trimStart()}else line=t;
      while(ctx.measureText(line).width>maxW&&line.length>1){let i=line.length;while(i>1&&ctx.measureText(line.slice(0,i)).width>maxW)i--;out.push(line.slice(0,i));line=line.slice(i)}}
    out.push(line)}
  return out}
function ptext(ctx,draw,str,x,y,maxW,size,weight,fam,color,lh,maxLines){str=tr(str);ctx.font=`${weight} ${size}px ${fam}`;let lines=wrapText(ctx,str,maxW);
  if(maxLines&&lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]=lines[maxLines-1].replace(/.{0,2}$/,'…')}
  lh=lh||Math.round(size*1.55);
  if(draw){ctx.fillStyle=color;ctx.textBaseline='alphabetic';lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh+Math.round(size*1.12)))}
  return lines.length*lh}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function loadImage(src){return new Promise(res=>{if(!src)return res(null);const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src})}
async function blobSrc(f){if(f.k==='a'){if(window.TRIP_FETCH_DATAURL){try{return await window.TRIP_FETCH_DATAURL(f.id)}catch(e){return ''}}return '/_blob/'+f.id}if(S.blobCache[f.id])return S.blobCache[f.id];
  try{const s=await S.db.doc(`trips/${S.tripId}/blobs/${f.id}`).get();if(s.exists){S.blobCache[f.id]=s.data().d;return S.blobCache[f.id]}}catch(e){}return ''}
function drawCover(ctx,im,x,y,w,h,r){const s=Math.max(w/im.naturalWidth,h/im.naturalHeight),dw=im.naturalWidth*s,dh=im.naturalHeight*s;
  ctx.save();rrect(ctx,x,y,w,h,r);ctx.clip();ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);ctx.restore()}

function makePdf(pages){const enc=new TextEncoder(),parts=[];let len=0;const off=[];
  const w=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const W=595.28,H=841.89,n=pages.length,per=4,kids=[];for(let i=0;i<n;i++)kids.push(`${3+i*per} 0 R`);
  const pdfStr=s=>'('+encodeURI(s).replace(/%25([0-9A-F]{2})/gi,'%$1').replace(/[()\\]/g,m=>'\\'+m)+')';
  w('%PDF-1.4\n');
  off[1]=len;w('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  off[2]=len;w(`2 0 obj\n<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>\nendobj\n`);
  pages.forEach((pg,i)=>{const p=3+i*per,c=p+1,x=p+2,a=p+3,cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;const k=W/PW;
    const annots=pg.links.map(L=>`<< /Type /Annot /Subtype /Link /Border [0 0 0] /Rect [${(L.x*k).toFixed(2)} ${(H-(L.y+L.h)*k).toFixed(2)} ${((L.x+L.w)*k).toFixed(2)} ${(H-L.y*k).toFixed(2)}] /A << /S /URI /URI ${pdfStr(L.url)} >> >>`).join(' ');
    off[p]=len;w(`${p} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${x} 0 R >> >> /Contents ${c} 0 R /Annots ${a} 0 R >>\nendobj\n`);
    off[c]=len;w(`${c} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
    off[x]=len;w(`${x} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${PW} /Height ${PH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.jpg.length} >>\nstream\n`);w(pg.jpg);w('\nendstream\nendobj\n');
    off[a]=len;w(`${a} 0 obj\n[${annots}]\nendobj\n`)});
  const total=3+n*per,xref=len;let s=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)s+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  w(s+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'})}

async function buildPdf(opt,progress){
  progress('กำลังเตรียมตัวอักษร…');
  try{await Promise.all([`600 40px "Bai Jamjuree"`,`700 40px "Bai Jamjuree"`,`400 24px "IBM Plex Sans Thai"`,`600 24px "IBM Plex Sans Thai"`,`600 24px "IBM Plex Mono"`].map(f=>document.fonts.load(f,'ทริป 0123')))}catch(e){}
  const t=S.trip,cats=placeCats(),days=tripDays(t);
  const groups={};for(const p of S.places){const k=days.includes(p.day)?p.day:'';(groups[k]=groups[k]||[]).push(p)}
  const keys=[...days.filter(d=>groups[d]),...(groups['']?['']:[])];
  // preload photos
  const imgMap=new Map();
  if(opt.photos){const all=[];S.places.forEach(p=>{(p.photos||[]).forEach(f=>all.push(f));(p.files||[]).filter(f=>(f.type||'').startsWith('image/')).forEach(f=>all.push(f))});
    for(const [i,f] of all.entries()){progress(`กำลังโหลดรูป ${i+1}/${all.length}`);imgMap.set(f.id,await loadImage(await blobSrc(f)))}}
  const pages=[];let ctx,y,cur;
  const newPage=()=>{const c=document.createElement('canvas');c.width=PW;c.height=PH;ctx=c.getContext('2d');if(LANG==='en'){const f=ctx.fillText,m=ctx.measureText;ctx.fillText=function(t,...a){return f.call(this,tr(t),...a)};ctx.measureText=function(t){return m.call(this,tr(t))}}ctx.fillStyle='#fff';ctx.fillRect(0,0,PW,PH);cur={c,links:[]};pages.push(cur);y=PM};
  const room=()=>PH-PM-50-y;
  const place=(fn,keepNext)=>{const h=fn(false,y)+(keepNext?keepNext(false,0):0);if(h>room()&&y>PM)newPage();fn(true,y);y+=fn(false,y)};
  newPage();
  // cover
  place((d,y0)=>{let h=0;const x=PM;
    if(d){ctx.fillStyle=PC.accent;ctx.fillRect(x,y0,CW,10)}h+=40;
    h+=ptext(ctx,d,'ITINERARY · แผนเที่ยว',x,y0+h,CW,22,600,FB,PC.muted)+6;
    h+=ptext(ctx,d,t.name||'ทริป',x,y0+h,CW,64,700,FD,PC.ink,84)+10;
    h+=ptext(ctx,d,`${dlabel(t.start,{day:'numeric',month:'long',year:'numeric'})} – ${dlabel(t.end,{day:'numeric',month:'long',year:'numeric'})} · ${days.length} วัน · ${S.places.length} สถานที่`,x,y0+h,CW,28,600,FB,PC.accent)+8;
    h+=ptext(ctx,d,'ผู้ร่วมทริป: '+people().map(p=>p.name).join(', '),x,y0+h,CW,24,400,FB,PC.muted)+30;
    if(d){ctx.fillStyle=PC.line;ctx.fillRect(x,y0+h,CW,2)}h+=36;return h});
  const TX=PM,BX=PM+150,BW=CW-150;
  for(const k of keys){const arr=groups[k].sort(sortFor(k)),idx=days.indexOf(k);
    let tk=0,tm=0,est=false,anyLeg=false;for(let i=1;i<arr.length;i++){const L=legOf(arr[i-1],arr[i]);if(L){anyLeg=true;tk+=+L.km||0;tm+=+L.min||0;if(!L.manual&&!L.auto)est=true}}
    const dayHead=(d,y0)=>{let h=24;const pill=k?`วันที่ ${idx+1}`:'ยังไม่กำหนดวัน';ctx.font=`600 24px ${FB}`;const pw=ctx.measureText(pill).width+32;
      if(d){ctx.fillStyle=PC.ink;rrect(ctx,PM,y0+h,pw,44,8);ctx.fill();ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.fillText(pill,PM+16,y0+h+23)}
      const dh=k?ptext(ctx,d,dlabel(k,{weekday:'long',day:'numeric',month:'long',year:'numeric'}),PM+pw+20,y0+h-6,CW-pw-20,36,600,FD,PC.ink,52):44;
      h+=Math.max(52,dh)+4;
      if(anyLeg)h+=ptext(ctx,d,`${est?'≈ ':''}เดินทางรวม ${kmTxt(tk)} · ${minTxt(tm)}`,PM,y0+h,CW,22,600,FB,PC.muted)+4;
      if(d){ctx.fillStyle=PC.ink;ctx.fillRect(PM,y0+h+6,CW,3)}h+=24;return h};
    const stopBlock=i=>(d,y0)=>{const p=arr[i],c=catOf(cats,p.cat),L=i>0?legOf(arr[i-1],p):null;let h=0;
      if(L){const s=`↓ ${L.manual||L.auto?'':'≈ '}${isSet(L.km)?kmTxt(L.km):''}${isSet(L.km)&&isSet(L.min)?' · ':''}${isSet(L.min)?minTxt(L.min):''} จากจุดก่อนหน้า`;
        h+=ptext(ctx,d,s,BX,y0+h,BW,21,600,FB,PC.accent)+6}
      const top=y0+h;
      if(p.time)ptext(ctx,d,p.time,TX,top+4,140,28,600,FM,PC.ink);
      if(d){ctx.fillStyle=PC.sun;ctx.beginPath();ctx.arc(BX+20,top+26,20,0,Math.PI*2);ctx.fill();ctx.fillStyle=PC.ink;ctx.font=`600 20px ${FM}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),BX+20,top+27);ctx.textAlign='left'}
      h+=ptext(ctx,d,p.name,BX+56,top,BW-56,36,600,FD,PC.ink,50)+4;
      if(d){ctx.fillStyle=c.color;ctx.beginPath();ctx.arc(BX+62,y0+h+17,8,0,Math.PI*2);ctx.fill()}
      h+=ptext(ctx,d,c.name,BX+80,y0+h,BW-80,21,500,FB,PC.muted)+4;
      if(p.address)h+=ptext(ctx,d,'ที่อยู่: '+p.address,BX+56,y0+h,BW-56,22,400,FB,PC.muted)+2;
      if(p.desc)h+=8+ptext(ctx,d,p.desc,BX+56,y0+h+8,BW-56,25,400,FB,PC.ink,40);
      if(p.note)h+=6+ptext(ctx,d,'หมายเหตุ: '+p.note,BX+56,y0+h+6,BW-56,21,400,FB,PC.muted);
      const ph=opt.photos?[...(p.photos||[]),...(p.files||[]).filter(f=>(f.type||'').startsWith('image/'))].filter(f=>imgMap.get(f.id)):[];
      if(ph.length){h+=16;const gap=16,cols=3,cw=(BW-56-gap*(cols-1))/cols,ih=Math.round(cw*.72);
        for(let r=0;r<Math.ceil(ph.length/cols);r++){let rowH=ih;
          for(let j=0;j<cols;j++){const f=ph[r*cols+j];if(!f)break;const x=BX+56+j*(cw+gap);
            if(d)drawCover(ctx,imgMap.get(f.id),x,y0+h,cw,ih,10);
            if(f.cap)rowH=Math.max(rowH,ih+6+ptext(ctx,d,f.cap,x,y0+h+ih+6,cw,19,400,FB,PC.muted,28,3))}
          h+=rowH+gap}}
      const url=openUrl(p);if(url){h+=6;ctx.font=`600 21px ${FB}`;const lab='เปิดใน Google Maps ›',lw=ctx.measureText(lab).width;
        if(d){ctx.fillStyle=PC.accent;ctx.textBaseline='alphabetic';ctx.fillText(lab,BX+56,y0+h+24);cur.links.push({x:BX+56,y:y0+h,w:lw,h:32,url})}h+=36}
      h+=18;if(d){ctx.fillStyle=PC.line;ctx.fillRect(PM,y0+h,CW,2)}h+=20;return h};
    progress(`กำลังจัดหน้า ${k?dlabel(k):'จุดที่ยังไม่กำหนดวัน'}`);
    place(dayHead,arr.length?stopBlock(0):null);
    arr.forEach((_,i)=>place(stopBlock(i)));
  }
  if(opt.expenses&&S.expenses.length){const c=calc(),ec=expCats();
    place((d,y0)=>{let h=24;h+=ptext(ctx,d,'สรุปค่าใช้จ่าย',PM,y0+h,CW,40,700,FD,PC.ink,56);
      h+=ptext(ctx,d,`รวมทั้งทริป ${baht(c.total)} · เฉลี่ยต่อคน ${baht(people().length?c.total/people().length:0)}`,PM,y0+h,CW,26,600,FB,PC.accent)+10;
      if(d){ctx.fillStyle=PC.ink;ctx.fillRect(PM,y0+h,CW,3)}h+=20;
      for(const [id,a] of Object.entries(c.byCat).sort((a,b)=>b[1]-a[1])){ptext(ctx,d,catOf(ec,id).name,PM,y0+h,CW-260,24,400,FB,PC.ink);
        ctx.font=`600 24px ${FM}`;const s=fmt(a);if(d){ctx.fillStyle=PC.ink;ctx.fillText(s,PM+CW-ctx.measureText(s).width,y0+h+27)}h+=40}
      h+=14;h+=ptext(ctx,d,'ยอดของแต่ละคน',PM,y0+h,CW,30,600,FD,PC.ink,46);
      for(const r of c.rows){const res=r.owe>.5?'เหลือจ่าย '+baht(r.owe):r.owe<-.5?'ได้คืน '+baht(-r.owe):'ครบแล้ว';
        ptext(ctx,d,r.p.name,PM,y0+h,CW-360,24,600,FB,PC.ink);ctx.font=`600 24px ${FM}`;if(d){ctx.fillStyle=r.owe>.5?'#B9461A':r.owe<-.5?'#167A3E':PC.ink;ctx.fillText(res,PM+CW-ctx.measureText(res).width,y0+h+27)}
        h+=36;h+=ptext(ctx,d,`ใช้ ${fmt(r.share)} − ล่วงหน้า ${fmt(r.dep)} − สำรองจ่าย ${fmt(r.paid)}`,PM,y0+h,CW,19,400,FM,PC.muted)+12}
      if(c.xf.length){h+=10;h+=ptext(ctx,d,'ใครโอนให้ใคร',PM,y0+h,CW,30,600,FD,PC.ink,46);
        for(const x of c.xf)h+=ptext(ctx,d,`${pname(x.from)} → ${pname(x.to)}  ${baht(x.amt)}`,PM,y0+h,CW,24,400,FB,PC.ink)+4}
      return h+20})}
  progress('กำลังรวมเป็นไฟล์ PDF…');
  const out=[];
  for(const [i,pg] of pages.entries()){const g=pg.c.getContext('2d');g.font=`400 18px ${FM}`;g.fillStyle=PC.faint;g.textBaseline='alphabetic';
    const s=`${i+1} / ${pages.length}`;g.fillText(s,PW-PM-g.measureText(s).width,PH-48);g.font=`400 18px ${FB}`;g.fillText(t.name||'',PM,PH-48);
    const b=await new Promise(r=>pg.c.toBlob(r,'image/jpeg',.86));out.push({jpg:new Uint8Array(await b.arrayBuffer()),links:pg.links})}

     :'<div class="empty small">ทุกคนจ่ายครบแล้ว ไม่ต้องโอนเพิ่ม</div>'}</div>

  const b=v.querySelector('#cpS');if(b)b.onclick=()=>copyText(summaryText(c));

function summaryText(c){const t=S.trip;const L=[`สรุปค่าใช้จ่าย ${t.name} (${dlabel(t.start,{day:'numeric',month:'short'})} – ${dlabel(t.end,{day:'numeric',month:'short'})})`,`รวม ${baht(c.total)} · ${people().length} คน`,...((S.trip.currencies||[]).filter(x=>x.rate&&x.code!==baseCur()).map(x=>`อัตราที่ใช้: 1 ${x.code} = ${x.rate} ${baseCur()}`)),''];
  Object.entries(c.byCat).sort((a,b)=>b[1]-a[1]).forEach(([id,a])=>L.push(`- ${catOf(expCats(),id).name}: ${baht(a)}`));L.push('');
  c.rows.forEach(r=>L.push(`${r.p.name}: ใช้ ${fmt(r.share)} หักล่วงหน้า ${fmt(r.dep)} หักสำรองจ่าย ${fmt(r.paid)} → ${r.owe>.5?'เหลือจ่าย '+baht(r.owe):r.owe<-.5?'ได้คืน '+baht(-r.owe):'ครบแล้ว'}`));
  if(c.xf.length){L.push('','การโอน:');c.xf.forEach(x=>L.push(`${pname(x.from)} → ${pname(x.to)} ${baht(x.amt)}`))}return L.join('\n')}

function docSheet(d){const files=[...((d&&d.files)||[])];
  openSheet(d?'แก้ไขเอกสาร':'เพิ่มเอกสาร',`<div class="field"><label for="dt">ชื่อเอกสาร</label><input class="inp" id="dt" value="${esc(d?.title||'')}" placeholder="เช่น ใบยืนยันโรงแรม"></div>
   <div class="field"><label for="dn2">รายละเอียด</label><textarea class="inp" id="dn2" placeholder="เลขที่การจอง เวลาเช็กอิน ฯลฯ">${esc(d?.note||'')}</textarea></div>
   <div class="field"><span class="lbl">ไฟล์</span><div id="df"></div></div>
   <div class="actions">${d?'<button type="button" class="btn danger" id="del">ลบ</button>':''}<span class="grow"></span><button type="button" class="btn" id="cx">ยกเลิก</button><button class="btn pri" id="ok">บันทึก</button></div>`,f=>{
    attachWidget(f.querySelector('#df'),files);f.querySelector('#cx').onclick=closeSheet;
    if(d)f.querySelector('#del').onclick=()=>confirmBox(`ลบเอกสาร "${d.title}" และไฟล์ในนั้น?`,'ลบ',async()=>{try{await S.db.doc(`trips/${S.tripId}/docs/${d.id}`).delete();cleanupFiles(d.files||[],[])}catch(e){writeErr(e)}});
    f.querySelector('#ok').onclick=async()=>{const title=f.querySelector('#dt').value.trim()||(files[0]?.name)||'';if(!title){f.querySelector('#dt').focus();return}
      const data={title,note:f.querySelector('#dn2').value.trim(),files,updatedAt:Date.now()};f.querySelector('#ok').disabled=true;
      try{if(d){await S.db.doc(`trips/${S.tripId}/docs/${d.id}`).update(data);cleanupFiles(d.files||[],files)}else await S.db.doc(`trips/${S.tripId}/docs/${'dc'+gid()}`).set({...data,createdBy:S.uid,createdAt:Date.now()});closeSheet();toast('บันทึกแล้ว')}
      catch(e){f.querySelector('#ok').disabled=false;writeErr(e)}};});}

  const lv=q('#leave');if(lv)lv.onclick=()=>confirmBox('ออกจากทริปนี้? ชื่อของคุณยังอยู่ในรายการค่าใช้จ่าย เข้าร่วมใหม่ได้ด้วยรหัสเชิญ','ออกจากทริป',async()=>{
    if(await saveTrip({members:(t.members||[]).filter(m=>m!==S.uid),people:ps.map(p=>p.uid===S.uid?{...p,uid:null}:p)}))go('')});
}
function renameSheet(title,cur,onSave){openSheet(title,`<div class="field"><label for="rn">ชื่อ</label><input class="inp" id="rn" value="${esc(cur)}"></div><div class="actions"><button type="button" class="btn" id="cx">ยกเลิก</button><button class="btn pri" id="ok">บันทึก</button></div>`,f=>{
  const i=f.querySelector('#rn');i.focus();i.select();f.querySelector('#cx').onclick=closeSheet;f.querySelector('#ok').onclick=async()=>{const n=i.value.trim();if(!n)return;closeSheet();await onSave(n)}})}
</script>
