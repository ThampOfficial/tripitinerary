<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#F3F6F5; --card:#FFFFFF; --ink:#13302A; --muted:#5A6F68; --line:#D8E2DE; --soft:#E8EFEC;
  --accent:#0E7A6B; --accent-ink:#FFFFFF; --sun:#E9A23B; --sun-soft:#FBEBD0;
  --danger:#B9461A; --good:#167A3E; --shadow:0 1px 2px rgba(19,48,42,.06),0 6px 18px rgba(19,48,42,.06);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0D1715; --card:#14211E; --ink:#E4EEEA; --muted:#92A8A0; --line:#263832; --soft:#1B2B27;
  --accent:#38C1AB; --accent-ink:#06231E; --sun:#F2B55A; --sun-soft:#3A2E1A;
  --danger:#F08A5D; --good:#5BD38A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--paper);margin:0}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.25}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:56px}
.top h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12.5px;color:var(--muted)}
.busy{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);flex:none;padding:0}
.iconbtn:hover{background:var(--soft)} .iconbtn svg{width:19px;height:19px} .iconbtn[disabled]{opacity:.35}

main{padding-block:16px 120px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:500;white-space:nowrap;text-decoration:none;color:inherit}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.sm{min-height:32px;padding:0 10px;font-size:13.5px;border-radius:8px}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px 16px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.section-h h2{font-size:17px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.pre{background:var(--sun-soft);color:color-mix(in srgb,var(--sun) 55%,var(--ink))}
.tag.trip{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.tag.late{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}

.hero{padding-block:8px 4px} .hero h1{font-size:28px}
.pass{display:grid;grid-template-columns:1fr auto;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;width:100%;padding:0;box-shadow:var(--shadow)}
.pass:hover{border-color:var(--accent)}
.pass .main{padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:6px}
.pass .name{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.3}
.pass .route{display:flex;align-items:center;gap:8px;font-size:14px}
.pass .route .line{flex:1;max-width:80px;border-top:1.5px dashed var(--line)}
.pass .stub{border-left:2px dashed var(--line);padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:92px;position:relative;background:var(--soft)}
.pass .stub::before,.pass .stub::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.pass .stub::before{top:-9px}.pass .stub::after{bottom:-9px}
.pass .code{font-family:var(--f-mono);font-weight:600;font-size:15px;letter-spacing:.12em}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding-block:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;border-radius:10px;color:var(--muted);font-size:12px;font-weight:500}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}

/* plan */
.day{display:flex;flex-direction:column;gap:8px}
.day-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.day-n{font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--ink);color:var(--paper);border-radius:6px;padding:2px 7px;letter-spacing:.04em}
.day-h h3{font-size:16px;flex:1;min-width:0}
.daytot{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px}
.daytot b{font-family:var(--f-mono);font-weight:600}
.mapbox{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--soft);aspect-ratio:640/420;max-width:100%;display:grid;place-items:center;color:var(--muted);font-size:13.5px;text-align:center}
.mapbox img{width:100%;height:100%;object-fit:cover;display:block}
.mapbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mapbox .maptog{position:absolute;right:8px;bottom:8px;z-index:2}
.stop{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:12px 14px;align-items:start}
.stop .time{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:2px;line-height:1.35}
.stop .time b{display:block;color:var(--ink);font-size:14px}
.stop .nm{font-weight:600;font-size:15.5px;line-height:1.35;word-break:break-word;display:flex;gap:8px;align-items:flex-start}
.pinno{flex:none;display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--sun);color:#13302A;font-family:var(--f-mono);font-size:11.5px;font-weight:600;margin-top:1px}
.pinno span{transform:rotate(45deg)}
.pinno.first{background:var(--ink);color:var(--paper)}
.pinno.none{background:var(--soft);color:var(--muted)}
.stop .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.stop .note{font-size:13.5px;color:var(--muted);margin-top:4px;white-space:pre-wrap;word-break:break-word}
.stop .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.leg{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 80px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft)}
.leg .ln{width:2px;height:16px;background:repeating-linear-gradient(var(--accent) 0 4px,transparent 4px 7px)}
.leg b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.stopsep{border-top:1px solid var(--line)}

/* money */
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tot{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);min-width:0}
.tot .v{font-family:var(--f-mono);font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot.big{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tot.big .muted{color:color-mix(in srgb,var(--paper) 70%,transparent)}
@media (max-width:440px){.totals{grid-template-columns:1fr 1fr}.totals .big{grid-column:1/-1}}
.exp{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border:0;background:none;width:100%;text-align:left}
.exp + .exp{border-top:1px solid var(--line)}
.exp:hover{background:var(--soft)}
.exp .t{font-weight:600;min-width:0;word-break:break-word}
.exp .a{font-family:var(--f-mono);font-weight:600;text-align:right}
.exp .m{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.dategroup{font-size:12.5px;color:var(--muted);padding:10px 14px 4px;font-weight:600;background:var(--soft);border-top:1px solid var(--line)}
.dategroup:first-child{border-top:0;border-radius:14px 14px 0 0}

.bar{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar .fill{display:block;height:100%;border-radius:6px}
.bar .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num{font-family:var(--f-mono)}
.settle{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;align-items:center}
.settle + .settle{border-top:1px solid var(--line)}
.settle .who{font-weight:600}
.settle .res{font-family:var(--f-mono);font-weight:600;font-size:17px;text-align:right}
.settle .calc{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.pay{color:var(--danger)} .get{color:var(--good)}
.xfer{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap}
.xfer + .xfer{border-top:1px solid var(--line)}

.files{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center;padding:0;flex:none;text-decoration:none;color:inherit}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ft{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:4px;word-break:break-all;line-height:1.2}
.rmx{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:14px;line-height:1;padding:0}
.addfile{border-style:dashed;color:var(--muted);font-size:12px;flex-direction:column;gap:2px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.addfile svg{width:20px;height:20px}

.scrim{position:fixed;inset:0;background:rgba(8,20,17,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:calc(100% - 24px);overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:90%}}
.sheet h2{font-size:19px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:42px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:16px}
textarea.inp{min-height:70px;resize:vertical}
.inp:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:440px){.grid2,.grid3{grid-template-columns:1fr 1fr}.grid3>:first-child{grid-column:1/-1}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;min-height:34px;font-size:13.5px;font-weight:500;color:var(--muted);padding:0 8px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.checks{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:4px}
.check{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:6px 8px;border-radius:8px}
.check input[type=checkbox],.check input[type=radio]{width:18px;height:18px;accent-color:var(--accent)}
.check .inp{width:110px;min-height:34px;padding:4px 8px;font-size:15px;text-align:right}
.hint{font-size:12.5px;color:var(--muted)} .ok{color:var(--good)} .err{color:var(--danger)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--card);padding-block:10px 4px}
.actions .grow{flex:1}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.results button{border:0;background:none;text-align:left;padding:9px 12px;display:flex;flex-direction:column;gap:1px}
.results button + button{border-top:1px solid var(--line)}
.results button:hover{background:var(--soft)}
.preview{border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;max-width:100%}
.preview iframe{width:100%;height:100%;border:0;display:block}

.list-edit{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.li + .li{border-top:1px solid var(--line)}
.li .grow{flex:1;min-width:0;word-break:break-word}
.empty{text-align:center;padding:28px 18px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty svg{width:40px;height:40px;opacity:.6}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.light{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
.light img{max-width:100%;max-height:calc(100% - 60px);object-fit:contain;border-radius:6px}
.light .btn{background:#fff;color:#111;border-color:#fff}
.code-big{font-family:var(--f-mono);font-size:28px;font-weight:600;letter-spacing:.2em;background:var(--soft);border:1.5px dashed var(--line);border-radius:12px;padding:10px 16px;text-align:center;user-select:all}
.linkbox{font-family:var(--f-mono);font-size:12.5px;background:var(--soft);border-radius:10px;padding:8px 10px;word-break:break-all;user-select:all}
.banner{padding:10px 14px;border-radius:12px;background:var(--sun-soft);font-size:14px}
.avs{display:flex}
.av{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;margin-left:-6px;flex:none}
.av:first-child{margin-left:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top"><div class="wrap" id="topInner"><h1>ทริปด้วยกัน</h1></div></header>
<main><div class="wrap stack" id="view"><div class="empty"><strong>กำลังเปิดทริปของคุณ</strong></div></div></main>
<nav class="tabs" id="tabs" hidden><div class="wrap" id="tabsInner"></div></nav>
<div id="layer"></div>

<script>
const JOIN = <?= join ?>;
const APP_URL = <?= appUrl ?>;

/* ---------- icons ---------- */
const I={
plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>',
pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
coin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>',
pie:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v9h9a9 9 0 11-9-9z"/><path d="M15 3.5A9 9 0 0120.5 9H15z"/></svg>',
doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h4"/></svg>',
gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
nav:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>',
copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h8"/></svg>',
edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',

/* ---------- files (Google Drive) ---------- */
const thumbUrl=(id,w)=>`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w||400}`;
const viewUrl=id=>`https://drive.google.com/file/d/${encodeURIComponent(id)}/view`;
function readB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{res(im);setTimeout(()=>URL.revokeObjectURL(u),1000)};im.onerror=rej;im.src=u})}
async function compress(file){const im=await loadImg(file);const sc=Math.min(1,1800/Math.max(im.naturalWidth,im.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(b=>res(b),'image/jpeg',.82))}
async function uploadFile(file){
  let blob=file,type=file.type||'',name=file.name||'file';
  if(type.startsWith('image/')&&!/gif/.test(type)){try{blob=await compress(file);type='image/jpeg';name=name.replace(/\.\w+$/,'')+'.jpg'}catch(e){}}
  if(blob.size>10*1024*1024)throw new Error('ไฟล์ใหญ่เกิน 10 MB');
  return call('api_upload',S.tripId,name,type||'application/octet-stream',await readB64(blob))}
function thumbHTML(f,i,removable){
  const img=(f.type||'').startsWith('image/');const ext=(f.name||'').split('.').pop().slice(0,4).toUpperCase()||'FILE';
  const inner=img?`<img loading="lazy" alt="${esc(f.name)}" src="${esc(thumbUrl(f.id))}">`:`<span class="ft">${esc(ext)}<br>${esc((f.name||'').slice(0,18))}</span>`;
  const open=img?`<button type="button" class="thumb" data-open="${i}" title="${esc(f.name)}">${inner}</button>`:`<a class="thumb" href="${esc(viewUrl(f.id))}" target="_blank" rel="noopener" title="${esc(f.name)}">${inner}</a>`;
  return removable?`<span style="position:relative;display:inline-block">${open}<button type="button" class="rmx" data-rm="${i}" aria-label="ลบไฟล์">×</button></span>`:open}
const filesView=files=>files&&files.length?`<div class="files" data-files>${files.map((f,i)=>thumbHTML(f,i,false)).join('')}</div>`:'';
function wireFiles(root,files){root.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.stopPropagation();const f=files[+b.dataset.open];lightbox(thumbUrl(f.id,1600),f.name,viewUrl(f.id))})}
function attachWidget(host,files){
  const draw=()=>{host.innerHTML=`<div class="files">${files.map((f,i)=>thumbHTML(f,i,true)).join('')}

    <div class="hint" id="upMsg">รูปภาพหรือ PDF ไม่เกิน 10 MB ต่อไฟล์ เก็บใน Google Drive ของเจ้าของแอป</div>`;
    host.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.rm,1);draw()});
    wireFiles(host,files);
    host.querySelector('input[type=file]').onchange=async e=>{const list=[...e.target.files];const msg=host.querySelector('#upMsg');
      for(const [n,file] of list.entries()){msg.textContent=`กำลังอัปโหลด ${n+1}/${list.length}: ${file.name}`;
        try{files.push(await uploadFile(file))}catch(err){toast('อัปโหลดไม่สำเร็จ: '+(err.message||err),3600)}}

const openUrl=p=>p.url&&/^https?:\/\//.test(p.url)?p.url:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(ptQ(p));

function routeUrl(list,mode){if(list.length<2)return navUrl(list[0],mode);const o=list[0],d=list[list.length-1],w=list.slice(1,-1).slice(0,9);
  return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(ptQ(o))+'&destination='+encodeURIComponent(ptQ(d))+(w.length?'&waypoints='+encodeURIComponent(w.map(ptQ).join('|')):'')+'&travelmode='+(mode||'driving')}
const DIRFLG={driving:'d',walking:'w',transit:'r'};
function embedRoute(pts,mode){if(pts.length===1)return embedPoint(pts[0]);
  return 'https://maps.google.com/maps?saddr='+encodeURIComponent(pts[0].lat+','+pts[0].lng)+'&daddr='+pts.slice(1).map(p=>encodeURIComponent(p.lat+','+p.lng)).join('+to:')+'&dirflg='+(DIRFLG[mode]||'d')+'&output=embed'}

/* ---------- money math ---------- */
function portions(e){const ids=people().map(p=>p.id);let among=(e.among||[]).filter(id=>ids.includes(id));if(!among.length)among=ids;
  const a=+e.amount||0,out={};if(!among.length)return out;
  if(e.split==='custom'&&e.custom)among.forEach(id=>out[id]=+e.custom[id]||0);else among.forEach(id=>out[id]=a/among.length);return out}
function calc(){
  const ps=people(),share={},paid={},dep={};ps.forEach(p=>{share[p.id]=0;paid[p.id]=0;dep[p.id]=0});
  let total=0,fundSpent=0,pre=0,trip=0;const byCat={};
  for(const e of S.expenses){const a=+e.amount||0;total+=a;e.type==='pre'?pre+=a:trip+=a;byCat[e.cat]=(byCat[e.cat]||0)+a;
    if(e.paidBy==='fund')fundSpent+=a;else if(paid[e.paidBy]!=null)paid[e.paidBy]+=a;
    const pr=portions(e);for(const k in pr)if(share[k]!=null)share[k]+=pr[k]}
  let depTotal=0;for(const d of S.deposits){const a=+d.amount||0;depTotal+=a;if(dep[d.personId]!=null)dep[d.personId]+=a}
  const fundBal=depTotal-fundSpent;
  const rows=ps.map(p=>({p,share:share[p.id],dep:dep[p.id],paid:paid[p.id],owe:share[p.id]-dep[p.id]-paid[p.id]}));
  const parties=rows.map(r=>({id:r.p.id,v:-r.owe}));
  const holder=S.trip.fundHolder&&person(S.trip.fundHolder)?S.trip.fundHolder:null;
  if(Math.abs(fundBal)>.004){if(holder)parties.find(x=>x.id===holder).v-=fundBal;else parties.push({id:'fund',v:-fundBal})}
  const deb=parties.filter(x=>x.v<-.5).map(x=>({...x,v:-x.v})).sort((a,b)=>b.v-a.v),cre=parties.filter(x=>x.v>.5).sort((a,b)=>b.v-a.v),xf=[];
  let i=0,j=0;while(i<deb.length&&j<cre.length){const m=Math.min(deb[i].v,cre[j].v);xf.push({from:deb[i].id,to:cre[j].id,amt:m});deb[i].v-=m;cre[j].v-=m;if(deb[i].v<.5)i++;if(cre[j].v<.5)j++}
  return{total,pre,trip,byCat,rows,depTotal,fundSpent,fundBal,xf,holder}}

  S.tripId=null;S.trip=null;render();loadHome();
}

async function loadHome(){const ids=Object.keys(myTrips());
  if(!ids.length){S.homeList=[];render();return}
  try{const list=await call('api_listTrips',JSON.stringify(ids));S.homeList=list;
    const found=new Set(list.map(t=>t.id));ids.forEach(id=>{if(!found.has(id))setMyTrip(id,null)});if(!S.tripId)render()}
  catch(e){S.homeList=[];toast('โหลดรายการทริปไม่สำเร็จ');render()}}
async function openTrip(id){
  if(S.tripId!==id){S.tripId=id;S.trip=null;S.routes={};S.live={};lastJson='';render()}
  try{const d=await call('api_getTrip',id);
    if(!d){toast('ไม่พบทริปนี้ อาจถูกลบไปแล้ว');setMyTrip(id,null);go('');return}
    if(!(id in myTrips())){S.trip=d.trip;whoAmISheet(d.trip,false);}
    applyData(d);lastJson=JSON.stringify(d);render()}catch(e){toast('โหลดทริปไม่สำเร็จ');go('')}}

/* ---------- PLAN ---------- */
const dayMode=k=>(S.trip.dayModes&&S.trip.dayModes[k])||S.trip.mode||'driving';
const sortStops=(a,b)=>((a.order??0)-(b.order??0))||(a.time||'99').localeCompare(b.time||'99');
function routeKey(pts,mode){return mode+'|'+pts.map(p=>(+p.lat).toFixed(5)+','+(+p.lng).toFixed(5)).join(';')}
function ensureRoute(pts,mode){const k=routeKey(pts,mode);if(S.routes[k]||S.routePending[k]||!pts.length)return;
  S.routePending[k]=1;
  call('api_route',JSON.stringify(pts.map(p=>({lat:+p.lat,lng:+p.lng}))),mode,true).then(r=>{S.routes[k]=r}).catch(()=>{S.routes[k]={legs:[],map:'',err:1}})
    .finally(()=>{delete S.routePending[k];if(S.tab!=='plan')return;if(sheetOpen)needRender=true;else render()})}
function dayGroups(){const days=tripDays(S.trip),g={};
  for(const p of S.places){const k=days.includes(p.day)?p.day:'';(g[k]=g[k]||[]).push(p)}
  Object.values(g).forEach(a=>a.sort(sortStops));return{days,g}}
function renderPlan(v){
  const cats=placeCats(),{days,g}=dayGroups(),filt=S.placeFilter;
  const counts={};S.places.forEach(p=>counts[p.cat]=(counts[p.cat]||0)+1);
  const keys=[...days.filter(d=>g[d]),...(g['']?['']:[])];
  let html=`<div class="spread"><div><span class="eyebrow">แผนเที่ยว</span><h2 style="font-size:22px">${S.places.length} จุด · ${days.length} วัน</h2></div>
    <button class="btn pri" id="addP">${I.plus}เพิ่มสถานที่</button></div>
   <div class="chips"><button class="chip" data-f="all" aria-pressed="${filt==='all'}">ทั้งหมด</button>
    ${cats.map(c=>`<button class="chip" data-f="${esc(c.id)}" aria-pressed="${filt===c.id}"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}${counts[c.id]?` <span class="muted num">${counts[c.id]}</span>`:''}</button>`).join('')}</div>`;
  if(!S.places.length)html+=`<div class="card empty">${I.pin}<strong>ยังไม่มีสถานที่ในแผน</strong><span>เพิ่มจุดเที่ยว ที่พัก หรือที่จอดรถ ค้นหาชื่อหรือวางลิงก์ Google Maps แล้วแอปจะวาดเส้นทาง พร้อมบอกระยะทางและเวลาเดินทางระหว่างจุดให้</span></div>`;
  for(const k of keys){
    const arr=g[k],mode=dayMode(k),idx=days.indexOf(k);
    const locs=arr.filter(hasLoc),r=k&&locs.length?S.routes[routeKey(locs,mode)]:null;
    if(k&&locs.length)ensureRoute(locs,mode);
    const legs=r?r.legs:[];
    const totM=legs.reduce((s,l)=>s+(l.ok?l.m:0),0),totS=legs.reduce((s,l)=>s+(l.ok?l.s:0),0);
    const shown=filt==='all'?arr:arr.filter(p=>p.cat===filt);
    if(!shown.length)continue;
    // ETA chain + leg mapping
    let t=null,li=-1;const info={};
    for(const p of arr){let leg=null;
      if(hasLoc(p)){li++;if(li>0)leg=legs[li-1]||null}
      let arrive=null,late=0;
      if(t!=null)arrive=t+(leg&&leg.ok?leg.s/60:0);
      const fixed=toMin(p.time);
      if(fixed!=null){if(arrive!=null&&arrive>fixed+5)late=Math.round(arrive-fixed);arrive=fixed}
      info[p.id]={leg,no:hasLoc(p)?li:-1,arrive,late,computed:fixed==null&&arrive!=null};
      t=arrive!=null?arrive+(+p.stay||0):null}
    html+=`<section class="day" data-day="${esc(k)}"><div class="day-h">${k?`<span class="day-n">วันที่ ${idx+1}</span><h3>${esc(dlabel(k,{weekday:'long',day:'numeric',month:'short'}))}</h3>`:`<h3>ยังไม่กำหนดวัน</h3>`}</div>`;
    if(k&&locs.length){
      const live=S.live[k];
      html+=`<div class="spread"><div class="seg" data-mode-day="${esc(k)}" style="flex:1;max-width:340px">${MODES.map(([m,l])=>`<button type="button" data-mode="${m}" aria-pressed="${mode===m}">${l}</button>`).join('')}</div>
        <div class="daytot">${locs.length>1?(r?`<span>ระยะรวม <b>${km(totM)}</b></span><span>เดินทาง <b>${dur(totS)}</b></span>`:`<span class="muted">กำลังคำนวณเส้นทาง…</span>`):''}</div></div>
       <div class="mapbox">${live?`<iframe loading="lazy" src="${esc(embedRoute(locs,mode))}" title="แผนที่เส้นทาง"></iframe>`
         :r&&r.map?`<img alt="แผนที่เส้นทางวันนี้" src="${r.map}">`:r?`<span>โหลดรูปแผนที่ไม่สำเร็จ กด "แผนที่เลื่อนได้" แทน</span>`:`<span>กำลังโหลดแผนที่…</span>`}
         <button type="button" class="btn sm maptog" data-live="${esc(k)}">${live?'ดูหมุดลำดับ':'แผนที่เลื่อนได้'}</button></div>
       <div class="row">${locs.length>1?`<a class="btn sm" href="${esc(routeUrl(locs,mode))}" target="_blank" rel="noopener">${I.route}เปิดเส้นทางใน Google Maps</a>`:''}
         ${locs.length>=4?`<button class="btn sm" data-opt="${esc(k)}">${I.magic}จัดลำดับให้เส้นทางสั้นที่สุด</button>`:''}</div>`}
    html+=`<div class="card">`;
    shown.forEach((p,i)=>{const c=catOf(cats,p.cat),inf=info[p.id];
      if(filt==='all'&&inf.leg)html+=`<div class="leg"><span class="ln"></span>${inf.leg.ok?`<b>${km(inf.leg.m)}</b> · <b>${dur(inf.leg.s)}</b>`:'<span>หาเส้นทางไม่ได้</span>'}</div>`;
      else if(i>0)html+=`<div class="stopsep"></div>`;
      const pin=inf.no>=0?`<span class="pinno ${inf.no===0?'first':''}"><span>${LABELS[inf.no]||'·'}</span></span>`:`<span class="pinno none" title="ยังไม่มีตำแหน่ง"><span>?</span></span>`;
      html+=`<div class="stop" data-pid="${esc(p.id)}"><div class="time">${p.time?`<b>${esc(p.time)}</b>`:inf.computed?`<b>~${hm(inf.arrive)}</b>`:'—'}${+p.stay?`<span>อยู่ ${dur(p.stay*60)}</span>`:''}</div><div style="min-width:0">
        <div class="nm">${pin}<span>${esc(p.name)}</span></div>
        <div class="meta"><span class="tag"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</span>${hasLoc(p)?'':'<span class="tag late">ยังไม่มีตำแหน่ง</span>'}${inf.late?`<span class="tag late">ไปถึงช้ากว่าเวลา ~${dur(inf.late*60)}</span>`:''}${(p.files||[]).length?`<span class="tag">📎 ${p.files.length}</span>`:''}</div>
        ${p.address?`<div class="note">${esc(p.address)}</div>`:''}${p.note?`<div class="note">${esc(p.note)}</div>`:''}${filesView(p.files)}
        <div class="acts"><a class="btn sm" href="${esc(navUrl(p,mode))}" target="_blank" rel="noopener">${I.nav}นำทาง</a><a class="btn sm" href="${esc(openUrl(p))}" target="_blank" rel="noopener">${I.pin}แผนที่</a>
         <button class="btn sm" data-share>${I.copy}แชร์</button><button class="btn sm" data-edit>${I.edit}แก้ไข</button>
         ${filt==='all'&&arr.length>1?`<button class="iconbtn" style="width:32px;height:32px" data-mv="-1" ${i===0?'disabled':''} aria-label="เลื่อนขึ้น">${I.up}</button><button class="iconbtn" style="width:32px;height:32px" data-mv="1" ${i===arr.length-1?'disabled':''} aria-label="เลื่อนลง">${I.down}</button>`:''}</div>
      </div></div>`});
    html+=`</div></section>`}
  v.innerHTML=html;
  v.querySelector('#addP').onclick=()=>placeSheet(null);
  v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.placeFilter=b.dataset.f;render()});
  v.querySelectorAll('[data-live]').forEach(b=>b.onclick=()=>{S.live[b.dataset.live]=!S.live[b.dataset.live];render()});
  v.querySelectorAll('[data-mode-day] [data-mode]').forEach(b=>b.onclick=()=>{const k=b.closest('[data-mode-day]').dataset.modeDay;
    const dm={...(S.trip.dayModes||{}),[k]:b.dataset.mode};S.trip.dayModes=dm;render();mutate('api_updateTrip',[S.tripId,JSON.stringify({dayModes:dm})]).catch(()=>{})});
  v.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>optimizeDay(b.dataset.opt));
  v.querySelectorAll('.stop').forEach(row=>{const p=S.places.find(x=>x.id===row.dataset.pid);
    row.querySelector('[data-edit]').onclick=()=>placeSheet(p);
    row.querySelector('[data-share]').onclick=()=>copyText([p.name,catOf(cats,p.cat).name+(p.day?' · '+dlabel(p.day):'')+(p.time?' '+p.time:''),p.address,openUrl(p)].filter(Boolean).join('\n'));
    row.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>movePlace(p,+b.dataset.mv));
    const fh=row.querySelector('[data-files]');if(fh)wireFiles(fh,p.files)})}
function saveOrder(list){const ch=list.map((x,k)=>({id:x.id,order:k*10})).filter((x,k)=>(list[k].order??-1)!==x.order);
  list.forEach((x,k)=>x.order=k*10);render();
  if(ch.length)mutate('api_saveOrders',[S.tripId,JSON.stringify(ch)]).catch(()=>{})}
function movePlace(p,dir){const {days,g}=dayGroups();const arr=g[days.includes(p.day)?p.day:''].slice();
  const i=arr.findIndex(x=>x.id===p.id),j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];saveOrder(arr)}
async function optimizeDay(k){
  const {g}=dayGroups(),arr=g[k],locs=arr.filter(hasLoc),mode=dayMode(k);
  let order;try{order=await call('api_optimize',JSON.stringify(locs.map(p=>({lat:+p.lat,lng:+p.lng}))),mode)}catch(e){toast('จัดลำดับไม่สำเร็จ');return}
  if(!order){toast('หาเส้นทางที่ดีกว่าไม่ได้');return}
  const newLocs=[locs[0],...order.map(i=>locs[1+i]),locs[locs.length-1]];
  if(newLocs.every((p,i)=>p===locs[i])){toast('ลำดับตอนนี้สั้นที่สุดแล้ว');return}
  let q=0;const out=arr.map(p=>hasLoc(p)?newLocs[q++]:p);
  openSheet('ลำดับใหม่ที่แนะนำ',`<p class="hint" style="margin:0">จุดแรกและจุดสุดท้ายของวันคงเดิม จัดเฉพาะจุดตรงกลางให้ระยะทางรวมสั้นที่สุด</p>
    <div class="card list-edit">${out.map((p,i)=>`<div class="li"><span class="num muted" style="width:22px">${i+1}</span><span class="grow">${esc(p.name)}</span>${p.time?`<span class="tag num">${esc(p.time)}</span>`:''}</div>`).join('')}</div>
    ${out.some(p=>p.time)?'<p class="hint err" style="margin:0">บางจุดกำหนดเวลาไว้ ตรวจเวลาอีกครั้งหลังจัดลำดับ</p>':''}
    <div class="actions"><button type="button" class="btn" id="cx">ยกเลิก</button><button class="btn pri" id="ok">ใช้ลำดับนี้</button></div>`,f=>{
    f.querySelector('#cx').onclick=closeSheet;f.querySelector('#ok').onclick=()=>{closeSheet();saveOrder(out)}})}

     <div id="lres"></div><div id="lprev"></div></div>

    const search=async()=>{const v=q('#loc').value.trim()||q('#pn').value.trim();if(!v)return;const m=q('#lmsg');m.className='hint';m.textContent='กำลังค้นหา…';

          const g=await call('api_resolveLink',v);if(g)setLoc(g);else{m.className='hint err';m.textContent='อ่านตำแหน่งจากลิงก์ไม่ได้ ลองพิมพ์ชื่อสถานที่แล้วค้นหาแทน'}}

          m.textContent='เลือกตำแหน่งที่ถูกต้อง';
          q('#lres').innerHTML=`<div class="results">${list.map((r,i)=>`<button type="button" data-r="${i}"><strong>${esc(r.name)}</strong><span class="hint">${esc(r.address)}</span></button>`).join('')}</div>`;

      catch(e){m.className='hint err';m.textContent='ค้นหาไม่สำเร็จ ลองอีกครั้ง'}};
    q('#lsearch').onclick=search;q('#loc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search()}});

      const name=q('#pn').value.trim();if(!name){q('#pn').focus();return}

        lat:st.lat,lng:st.lng,url:/^https?:\/\//.test(q('#loc').value.trim())?q('#loc').value.trim():st.url,

      q('#ok').disabled=true;

   ${!S.expenses.length?`<div class="card empty">${I.coin}<strong>ยังไม่มีค่าใช้จ่าย</strong><span>ใส่ค่าตั๋ว ค่าที่พักที่จองไว้แล้ว และค่าใช้จ่ายระหว่างทริป ระบุคนจ่ายและคนที่หาร แล้วแอปจะสรุปยอดให้ตอนจบทริป</span></div>`

      ${byDate[d].map(e=>{const k=catOf(cats,e.cat);const n=Object.keys(portions(e)).length;return `<button class="exp" data-eid="${esc(e.id)}"><span class="t">${esc(e.title)}</span><span class="a">${fmt(e.amount)}</span>
       <span class="m"><span class="tag ${e.type==='pre'?'pre':'trip'}">${e.type==='pre'?'ล่วงหน้า':'ระหว่างทริป'}</span><span class="tag"><span class="dot" style="background:${esc(k.color)}"></span>${esc(k.name)}</span>
       <span>${esc(pname(e.paidBy))} จ่าย · หาร ${n} คน${e.split==='custom'?' (กำหนดเอง)':''}</span>${(e.files||[]).length?`<span class="tag">📎 ${e.files.length}</span>`:''}</span></button>`}).join('')}`).join('')}</div>`}
   <div class="section-h"><h2>เงินกองกลาง / จ่ายล่วงหน้า</h2><button class="btn sm" id="addD">${I.plus}บันทึกเงิน</button></div>
   <p class="hint" style="margin:0">เงินที่แต่ละคนโอนเข้ากองกลางก่อนเที่ยว จะถูกหักออกจากยอดที่ต้องจ่ายตอนสรุป ค่าใช้จ่ายที่จ่ายจากกองกลางให้เลือกคนจ่ายเป็น "กองกลาง"</p>
   <div class="card">${S.deposits.length?S.deposits.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(d=>`<button class="exp" data-did="${esc(d.id)}"><span class="t">${esc(pname(d.personId))}</span><span class="a">${fmt(d.amount)}</span><span class="m">${esc(dlabel(d.date)||'')}${d.note?' · '+esc(d.note):''}</span></button>`).join('')
     +`<div class="exp" style="cursor:default"><span class="t">คงเหลือในกองกลาง</span><span class="a ${c.fundBal<0?'pay':''}">${fmt(c.fundBal)}</span><span class="m">รับ ${fmt(c.depTotal)} · ใช้ไป ${fmt(c.fundSpent)}</span></div>`
     :`<div class="empty small">ยังไม่มีเงินกองกลาง${c.fundSpent?` · ใช้จากกองกลางไปแล้ว ${baht(c.fundSpent)}`:''}</div>`}</div>`;

  v.querySelectorAll('[data-did]').forEach(b=>b.onclick=()=>depositSheet(S.deposits.find(e=>e.id===b.dataset.did)))}
function expenseSheet(e){
  const cats=expCats(),ps=people(),files=[...((e&&e.files)||[])],me=myPerson(),today=todayIso();
  const st={type:e?.type||(S.trip.start>today?'pre':'trip'),cat:e?.cat||cats[0]?.id,split:e?.split||'equal',
    among:new Set(e?.among?.length?e.among:ps.map(p=>p.id)),custom:{...(e?.custom||{})}};
  const defDate=e?.date||(today>=S.trip.start&&today<=S.trip.end?today:(S.trip.start>today?today:S.trip.start));
  openSheet(e?'แก้ไขค่าใช้จ่าย':'เพิ่มค่าใช้จ่าย',`
   <div class="seg" id="ty"><button type="button" data-v="pre">รู้ล่วงหน้า (จอง/ตั๋ว)</button><button type="button" data-v="trip">เกิดระหว่างทริป</button></div>

   <div class="grid2"><div class="field"><label for="ea">จำนวนเงิน (บาท)</label><input class="inp num" id="ea" inputmode="decimal" value="${e?esc(e.amount):''}" placeholder="0" style="font-size:20px"></div>
   <div class="field"><label for="ed">วันที่</label><input class="inp" type="date" id="ed" value="${esc(defDate)}"></div></div>
   <div class="field"><span class="lbl">หมวดหมู่</span><div class="chips" style="flex-wrap:wrap">${cats.map(c=>`<button type="button" class="chip" data-c="${esc(c.id)}"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</button>`).join('')}</div></div>
   <div class="field"><label for="ep">คนจ่าย</label><select class="inp" id="ep">${ps.map(p=>`<option value="${esc(p.id)}" ${(e?e.paidBy:me?.id)===p.id?'selected':''}>${esc(p.name)}${me&&p.id===me.id?' (ฉัน)':''}</option>`).join('')}<option value="fund" ${e?.paidBy==='fund'?'selected':''}>กองกลาง</option></select></div>
   <div class="field"><div class="spread"><span class="lbl">หารกับ</span><div class="seg" id="sp" style="min-width:200px"><button type="button" data-v="equal">หารเท่ากัน</button><button type="button" data-v="custom">กำหนดเอง</button></div></div>
     <div class="checks" id="am"></div><span class="hint" id="amh"></span></div>
   <div class="field"><label for="en">หมายเหตุ</label><textarea class="inp" id="en" placeholder="เลขที่การจอง ฯลฯ">${esc(e?.note||'')}</textarea></div>
   <div class="field"><span class="lbl">ใบเสร็จ / ตั๋ว / ไฟล์</span><div id="ef"></div></div>
   <div class="actions">${e?'<button type="button" class="btn danger" id="del">ลบ</button>':''}<span class="grow"></span><button type="button" class="btn" id="cx">ยกเลิก</button><button class="btn pri" id="ok">บันทึก</button></div>`,f=>{
    const q=s=>f.querySelector(s);
    const seg=(id,key)=>{const host=q(id);const upd=()=>host.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st[key]));
      host.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{st[key]=b.dataset.v;upd();if(key==='split')drawAm()});upd()};
    seg('#ty','type');seg('#sp','split');
    const cu=()=>f.querySelectorAll('[data-c]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===st.cat));
    f.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{st.cat=b.dataset.c;cu()});cu();
    const amt=()=>parseFloat((q('#ea').value||'').replace(/,/g,''))||0;
    const hint=()=>{const h=q('#amh'),n=st.among.size,a=amt();
      if(st.split==='equal'){h.className='hint';h.textContent=n?`คนละ ${fmt(a/n)} บาท`:'เลือกอย่างน้อย 1 คน'}
      else{const sum=[...st.among].reduce((s,id)=>s+(+st.custom[id]||0),0),left=a-sum;h.className='hint '+(Math.abs(left)<.01?'ok':'err');h.textContent=Math.abs(left)<.01?'ยอดครบแล้ว':`ยังขาดอีก ${fmt(left)} บาท`}};

        ${st.split==='custom'?`<input class="inp num" inputmode="decimal" data-cu="${esc(p.id)}" value="${st.among.has(p.id)&&st.custom[p.id]!=null?esc(st.custom[p.id]):''}" placeholder="0" ${st.among.has(p.id)?'':'disabled'}>`:'<span></span>'}</label>`).join('');
      host.querySelectorAll('[data-p]').forEach(cb=>cb.onchange=()=>{cb.checked?st.among.add(cb.dataset.p):st.among.delete(cb.dataset.p);drawAm()});

      const custom={};if(st.split==='custom'){let s=0;st.among.forEach(id=>{custom[id]=+st.custom[id]||0;s+=custom[id]});if(Math.abs(s-a)>=.01){toast('ยอดที่กำหนดเองยังไม่เท่ากับจำนวนเงิน');return}}
      const data={id:e?.id||'',tripId:S.tripId,title,amount:Math.round(a*100)/100,type:st.type,cat:st.cat||'',date:q('#ed').value,paidBy:q('#ep').value,split:st.split,among:[...st.among],custom,note:q('#en').value.trim(),files};
      q('#ok').disabled=true;
      try{await mutate('api_save',['Expenses',JSON.stringify(data)],'บันทึกแล้ว');closeSheet();render()}catch(x){q('#ok').disabled=false}}})}

   <div class="card pad stack" style="gap:10px">${c.rows.map((r,i)=>`<div class="bar"><span class="lab">${avatar(r.p,i)}${esc(r.p.name)}</span><span class="track"><span class="fill" style="width:${(r.share/maxS*100).toFixed(1)}%;background:${pcolor(i)}"></span></span><span class="num">${fmt(r.share)}</span></div>`).join('')}</div>
   <div class="card tbl-wrap"><table><thead><tr><th>คน</th><th>ส่วนที่ใช้</th><th>เงินล่วงหน้า</th><th>สำรองจ่าย</th><th>คงเหลือ</th></tr></thead><tbody>
    ${c.rows.map(r=>`<tr><td>${esc(r.p.name)}</td><td class="num">${fmt(r.share)}</td><td class="num">${fmt(r.dep)}</td><td class="num">${fmt(r.paid)}</td><td class="num ${r.owe>.5?'pay':r.owe<-.5?'get':''}">${r.owe>.5?'จ่าย '+fmt(r.owe):r.owe<-.5?'รับ '+fmt(-r.owe):'0'}</td></tr>`).join('')}
    <tr><td class="muted">กองกลาง</td><td class="num">—</td><td class="num">${fmt(c.depTotal)}</td><td class="num">${fmt(c.fundSpent)}</td><td class="num">เหลือ ${fmt(c.fundBal)}</td></tr></tbody></table></div>
   <div class="section-h"><h2>สรุปจบทริป</h2><button class="btn sm" id="cpS">${I.copy}คัดลอกส่งในแชท</button></div>
   <div class="card">${c.rows.map(r=>`<div class="settle"><span class="who">${esc(r.p.name)}</span><span class="res ${r.owe>.5?'pay':r.owe<-.5?'get':''}">${r.owe>.5?'เหลือจ่าย '+baht(r.owe):r.owe<-.5?'ได้คืน '+baht(-r.owe):'ครบแล้ว'}</span>
     <span class="calc">ใช้ ${fmt(r.share)} − ล่วงหน้า ${fmt(r.dep)} − สำรองจ่าย ${fmt(r.paid)} = ${fmt(r.owe)}</span></div>`).join('')}</div>
   <div class="section-h"><h2>ใครโอนให้ใคร</h2>${c.holder?`<span class="small muted">เงินกองกลางอยู่กับ ${esc(pname(c.holder))}</span>`:''}</div>
   <div class="card">${c.xf.length?c.xf.map(x=>`<div class="xfer"><strong>${esc(pname(x.from))}</strong><span class="muted">โอนให้ →</span><strong>${esc(pname(x.to))}</strong><span style="flex:1"></span><span class="num" style="font-weight:600">${baht(x.amt)}</span></div>`).join('')
     :'<div class="empty small">ทุกคนจ่ายครบแล้ว ไม่ต้องโอนเพิ่ม</div>'}</div>
   ${!c.holder&&Math.abs(c.fundBal)>.5?`<p class="hint" style="margin:0">ตั้งค่า "คนถือเงินกองกลาง" ในแท็บทริป เพื่อให้รายการโอนระบุชื่อคนแทนคำว่ากองกลาง</p>`:''}`}`;
  const b=v.querySelector('#cpS');if(b)b.onclick=()=>copyText(summaryText(c))}
function summaryText(c){const t=S.trip;const L=[`สรุปค่าใช้จ่าย ${t.name} (${dlabel(t.start,{day:'numeric',month:'short'})} – ${dlabel(t.end,{day:'numeric',month:'short'})})`,`รวม ${baht(c.total)} · ${people().length} คน`,''];
  Object.entries(c.byCat).sort((a,b)=>b[1]-a[1]).forEach(([id,a])=>L.push(`- ${catOf(expCats(),id).name}: ${baht(a)}`));L.push('');
  c.rows.forEach(r=>L.push(`${r.p.name}: ใช้ ${fmt(r.share)} หักล่วงหน้า ${fmt(r.dep)} หักสำรองจ่าย ${fmt(r.paid)} → ${r.owe>.5?'เหลือจ่าย '+baht(r.owe):r.owe<-.5?'ได้คืน '+baht(-r.owe):'ครบแล้ว'}`));
  if(c.xf.length){L.push('','การโอน:');c.xf.forEach(x=>L.push(`${pname(x.from)} → ${pname(x.to)} ${baht(x.amt)}`))}return L.join('\n')}

/* ---------- DOCS ---------- */
function renderDocs(v){
  const all=[];S.places.forEach(p=>(p.files||[]).forEach(f=>all.push(f)));S.expenses.forEach(e=>(e.files||[]).forEach(f=>all.push(f)));
  v.innerHTML=`<div class="spread"><div><span class="eyebrow">เอกสาร</span><h2 style="font-size:22px">ตั๋ว การจอง และไฟล์อ้างอิง</h2></div><button class="btn pri" id="addDoc">${I.plus}เพิ่มเอกสาร</button></div>
   ${S.docs.length?S.docs.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(d=>`<div class="card pad stack" data-doc="${esc(d.id)}" style="gap:8px"><div class="spread"><h3 style="font-size:16px;min-width:0;word-break:break-word">${esc(d.title)}</h3><button class="btn sm" data-ed>${I.edit}แก้ไข</button></div>
     ${d.note?`<div class="small" style="white-space:pre-wrap;word-break:break-word">${esc(d.note)}</div>`:''}${filesView(d.files)}</div>`).join('')
    :`<div class="card empty">${I.doc}<strong>ยังไม่มีเอกสาร</strong><span>เก็บรูปตั๋ว ใบยืนยันการจอง หรือประกันเดินทางไว้ที่นี่ ให้ทุกคนในทริปเปิดดูได้</span></div>`}
   ${all.length?`<div class="section-h"><h2>ไฟล์ที่แนบในรายการอื่น</h2><span class="small muted num">${all.length} ไฟล์</span></div><div class="card pad"><div class="files" id="allF">${all.map((f,i)=>thumbHTML(f,i,false)).join('')}</div></div>`:''}`;
  v.querySelector('#addDoc').onclick=()=>docSheet(null);
  v.querySelectorAll('[data-doc]').forEach(el=>{const d=S.docs.find(x=>x.id===el.dataset.doc);el.querySelector('[data-ed]').onclick=()=>docSheet(d);const fh=el.querySelector('[data-files]');if(fh)wireFiles(fh,d.files)});
  const af=v.querySelector('#allF');if(af)wireFiles(af,all)}
function docSheet(d){const files=[...((d&&d.files)||[])];
  openSheet(d?'แก้ไขเอกสาร':'เพิ่มเอกสาร',`<div class="field"><label for="dt">ชื่อเอกสาร</label><input class="inp" id="dt" value="${esc(d?.title||'')}" placeholder="เช่น ใบยืนยันโรงแรม"></div>
   <div class="field"><label for="dn2">รายละเอียด</label><textarea class="inp" id="dn2" placeholder="เลขที่การจอง เวลาเช็กอิน ฯลฯ">${esc(d?.note||'')}</textarea></div>
   <div class="field"><span class="lbl">ไฟล์</span><div id="df"></div></div>
   <div class="actions">${d?'<button type="button" class="btn danger" id="del">ลบ</button>':''}<span class="grow"></span><button type="button" class="btn" id="cx">ยกเลิก</button><button class="btn pri" id="ok">บันทึก</button></div>`,f=>{
    const q=s=>f.querySelector(s);attachWidget(q('#df'),files);q('#cx').onclick=closeSheet;
    if(d)q('#del').onclick=()=>confirmBox(`ลบเอกสาร "${d.title}" และไฟล์ในนั้น?`,'ลบ',()=>mutate('api_remove',['Docs',S.tripId,d.id],'ลบแล้ว'));
    q('#ok').onclick=async()=>{const title=q('#dt').value.trim()||(files[0]?.name)||'';if(!title){q('#dt').focus();return}
      q('#ok').disabled=true;
      try{await mutate('api_save',['Docs',JSON.stringify({id:d?.id||'',tripId:S.tripId,title,note:q('#dn2').value.trim(),files})],'บันทึกแล้ว');closeSheet();render()}catch(e){q('#ok').disabled=false}}})}

/* ---------- SETTINGS ---------- */
const saveTrip=(patch,msg)=>mutate('api_updateTrip',[S.tripId,JSON.stringify(patch)],msg).catch(()=>{});
function renderSettings(v){
  const t=S.trip,ps=people(),me=myPerson(),link=APP_URL+'?join='+encodeURIComponent(t.code);
  const used=id=>S.expenses.some(e=>e.paidBy===id||(e.among||[]).includes(id))||S.deposits.some(d=>d.personId===id);
  const catBlock=(key,title,list,usedFn)=>`<div class="section-h"><h2>${title}</h2><span class="small muted">${list.length} หมวด</span></div>
   <div class="card list-edit">${list.map(c=>`<div class="li"><span class="dot" style="background:${esc(c.color)};width:12px;height:12px"></span><span class="grow">${esc(c.name)} <span class="muted small num">${usedFn(c.id)||''}</span></span>
     <button class="btn sm" data-rn="${key}:${esc(c.id)}">เปลี่ยนชื่อ</button><button class="btn sm danger" data-rmc="${key}:${esc(c.id)}">ลบ</button></div>`).join('')}
     <div class="li"><input class="inp" id="new-${key}" placeholder="ชื่อหมวดใหม่" style="flex:1;min-width:140px"><button class="btn sm pri" data-addc="${key}">${I.plus}เพิ่ม</button></div></div>`;
  v.innerHTML=`<div class="card pad stack"><div class="spread"><div><span class="eyebrow">ชวนเพื่อนเข้าทริป</span><h3 style="font-size:17px">ลิงก์และรหัสเชิญ</h3></div><button class="btn sm" id="regen">สร้างรหัสใหม่</button></div>
     <div class="code-big">${esc(t.code)}</div><div class="linkbox">${esc(link)}</div>
     <button class="btn pri" id="cpInv">${I.copy}คัดลอกข้อความชวนเพื่อน</button>
     <p class="hint" style="margin:0">ส่งทาง LINE หรือแชทไหนก็ได้ เพื่อนกดลิงก์แล้วเลือกชื่อตัวเองได้เลย ไม่ต้องสมัครหรือล็อกอิน</p></div>
   <div class="card pad spread"><div><span class="eyebrow">บนเครื่องนี้ คุณคือ</span><h3 style="font-size:17px">${esc(me?.name||'ยังไม่เลือก')}</h3></div><button class="btn sm" id="who">เปลี่ยน</button></div>
   <div class="section-h"><h2>ข้อมูลทริป</h2></div>
   <div class="card pad stack"><div class="field"><label for="sn">ชื่อทริป</label><input class="inp" id="sn" value="${esc(t.name)}"></div>
     <div class="grid2"><div class="field"><label for="ss">วันเริ่ม</label><input class="inp" type="date" id="ss" value="${esc(t.start||'')}"></div><div class="field"><label for="se">วันกลับ</label><input class="inp" type="date" id="se" value="${esc(t.end||'')}"></div></div>
     <div class="grid2"><div class="field"><label for="sm">การเดินทางหลัก</label><select class="inp" id="sm">${MODES.map(([m,l])=>`<option value="${m}" ${(t.mode||'driving')===m?'selected':''}>${l}</option>`).join('')}</select></div>
     <div class="field"><label for="sh">คนถือเงินกองกลาง</label><select class="inp" id="sh"><option value="">ไม่ระบุ</option>${ps.map(p=>`<option value="${esc(p.id)}" ${t.fundHolder===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div>
     <div class="row" style="justify-content:flex-end"><button class="btn pri" id="saveInfo">บันทึกข้อมูลทริป</button></div></div>
   <div class="section-h"><h2>คนในทริป</h2><span class="small muted">${ps.length} คน · ใช้เป็นคนจ่ายและคนหาร</span></div>
   <div class="card list-edit">${ps.map((p,i)=>`<div class="li">${avatar(p,i)}<span class="grow">${esc(p.name)} ${me&&p.id===me.id?'<span class="tag">ฉัน</span>':p.joined?'<span class="tag">เข้าร่วมแล้ว</span>':'<span class="tag">ยังไม่เข้าร่วม</span>'}</span>
     <button class="btn sm" data-prn="${esc(p.id)}">เปลี่ยนชื่อ</button>${me&&p.id===me.id?'':`<button class="btn sm danger" data-prm="${esc(p.id)}">ลบ</button>`}</div>`).join('')}
     <div class="li"><input class="inp" id="newP" placeholder="ชื่อคนเพิ่ม" style="flex:1;min-width:140px"><button class="btn sm pri" id="addP2">${I.plus}เพิ่ม</button></div></div>
   ${catBlock('place','หมวดหมู่สถานที่',placeCats(),id=>{const n=S.places.filter(p=>p.cat===id).length;return n?n+' จุด':''})}
   ${catBlock('exp','หมวดหมู่ค่าใช้จ่าย',expCats(),id=>{const n=S.expenses.filter(e=>e.cat===id).length;return n?n+' รายการ':''})}
   <div class="section-h"><h2>จัดการทริป</h2></div>
   <div class="card pad row"><button class="btn" id="leave">เอาทริปออกจากเครื่องนี้</button><button class="btn danger" id="delTrip">ลบทริปนี้ถาวร</button>
     <span class="hint">ทุกคนที่มีลิงก์หรือรหัสเชิญเปิดทริปนี้ได้ ส่งเฉพาะเพื่อนร่วมทริป</span></div>`;
  const q=s=>v.querySelector(s);
  q('#cpInv').onclick=()=>copyText(`มาร่วมทริป "${t.name}" (${dlabel(t.start,{day:'numeric',month:'short'})} – ${dlabel(t.end,{day:'numeric',month:'short'})}) กัน\nกดลิงก์นี้แล้วเลือกชื่อตัวเอง\n${link}\n(รหัสเชิญ ${t.code})`);
  q('#regen').onclick=()=>confirmBox('สร้างรหัสใหม่? ลิงก์และรหัสเดิมจะใช้เข้าร่วมไม่ได้อีก คนที่อยู่ในทริปแล้วไม่ได้รับผลกระทบ','สร้างรหัสใหม่',()=>saveTrip({regenCode:true},'สร้างรหัสใหม่แล้ว'));
  q('#who').onclick=()=>whoAmISheet(t,false);
  q('#saveInfo').onclick=()=>{const name=q('#sn').value.trim();if(!name)return;let s=q('#ss').value,e=q('#se').value||s;if(e<s)e=s;saveTrip({name,start:s,end:e,mode:q('#sm').value,fundHolder:q('#sh').value||''},'บันทึกแล้ว')};
  q('#addP2').onclick=()=>{const n=q('#newP').value.trim();if(n)saveTrip({people:[...ps,{id:'p'+gid(),name:n,joined:false}]},'เพิ่มแล้ว')};
  v.querySelectorAll('[data-prn]').forEach(b=>b.onclick=()=>renameSheet('เปลี่ยนชื่อ',person(b.dataset.prn).name,n=>saveTrip({people:ps.map(p=>p.id===b.dataset.prn?{...p,name:n}:p)})));
  v.querySelectorAll('[data-prm]').forEach(b=>b.onclick=()=>{const p=person(b.dataset.prm);
    confirmBox(used(p.id)?`${p.name} มีค่าใช้จ่ายหรือเงินกองกลางอยู่ ถ้าลบ รายการเหล่านั้นจะไม่นับยอดของเขา และการหารจะเปลี่ยน ลบต่อหรือไม่?`:`ลบ ${p.name} ออกจากทริป?`,'ลบ',
      ()=>saveTrip({people:ps.filter(x=>x.id!==p.id),fundHolder:t.fundHolder===p.id?'':t.fundHolder}))});
  const field=k=>k==='place'?'placeCats':'expCats';
  v.querySelectorAll('[data-addc]').forEach(b=>b.onclick=()=>{const k=b.dataset.addc,n=q('#new-'+k).value.trim();if(!n)return;const list=t[field(k)]||[];saveTrip({[field(k)]:[...list,{id:'c'+gid(),name:n,color:pcolor(list.length)}]},'เพิ่มหมวดแล้ว')});
  v.querySelectorAll('[data-rn]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.rn.split(':');const list=t[field(k)]||[];renameSheet('เปลี่ยนชื่อหมวด',list.find(c=>c.id===id).name,n=>saveTrip({[field(k)]:list.map(c=>c.id===id?{...c,name:n}:c)}))});
  v.querySelectorAll('[data-rmc]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.rmc.split(':');const list=t[field(k)]||[];const c=list.find(x=>x.id===id);
    const n=k==='place'?S.places.filter(p=>p.cat===id).length:S.expenses.filter(e=>e.cat===id).length;
    confirmBox(n?`หมวด "${c.name}" มี ${n} รายการอยู่ รายการเหล่านั้นจะแสดงเป็น "ไม่มีหมวด" ลบหรือไม่?`:`ลบหมวด "${c.name}"?`,'ลบ',()=>saveTrip({[field(k)]:list.filter(x=>x.id!==id)}))});
  q('#leave').onclick=()=>confirmBox('เอาทริปนี้ออกจากรายการบนเครื่องนี้? ข้อมูลทริปยังอยู่ เข้ากลับได้ด้วยรหัสเชิญ','เอาออก',()=>{setMyTrip(S.tripId,null);go('')});
  q('#delTrip').onclick=()=>confirmBox(`ลบทริป "${t.name}" ทั้งหมด รวมไฟล์แนบ? ทุกคนในทริปจะไม่เห็นทริปนี้อีก`,'ลบทริป',async()=>{
    try{await call('api_deleteTrip',S.tripId);setMyTrip(S.tripId,null);toast('ลบทริปแล้ว');go('')}catch(e){toast('ลบไม่สำเร็จ')}})}
function renameSheet(title,cur,onSave){openSheet(title,`<div class="field"><label for="rn">ชื่อ</label><input class="inp" id="rn" value="${esc(cur)}"></div><div class="actions"><button type="button" class="btn" id="cx">ยกเลิก</button><button class="btn pri" id="ok">บันทึก</button></div>`,f=>{
  const i=f.querySelector('#rn');i.focus();i.select();f.querySelector('#cx').onclick=closeSheet;f.querySelector('#ok').onclick=()=>{const n=i.value.trim();if(!n)return;closeSheet();onSave(n)}})}

/* ---------- boot ---------- */
route();
if(JOIN)setTimeout(()=>joinSheet(String(JOIN).toUpperCase()),200);
</script>
</body>
</html>
